aliases: [Gln, Q, 麩醯胺酸]
smiles: "NC(=O)CC[C@H]([NH3+])C(=O)[O-]"
chain:                              # Lehninger：COO⁻ 在上、H₃N⁺ 在左（L 型）、R 基在下
