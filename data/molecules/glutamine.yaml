  - {c: C, l: "^+H_3N", r: H}
  - {c: CH_2}
  - {c: CH_2}
  - {c: C, dfork: {l: H_2N, r: O, rb: 2}}
decorate:
  boxes: [{rows: [2, 3, 4], name: R}]
tags: [amino_acid, polar]
notes_zh: "Gln / Q。血中最多的胺基酸、NH₃ 的主要運送形式（glutamine synthetase／glutaminase）。生糖。"
