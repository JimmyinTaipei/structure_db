id: arginine
name: Arginine
aliases: [Arg, R, 精胺酸]
smiles: "NC(=[NH2+])NCCC[C@H]([NH3+])C(=O)[O-]"
chain:                              # Lehninger：COO⁻ 在上、H₃N⁺ 在左（L 型）、R 基在下
  - {c: "COO^-"}
  - {c: C, l: "^+H_3N", r: H}
  - {c: CH_2}
  - {c: CH_2}
  - {c: CH_2}
  - {c: NH}
  - {c: C, r: "^+NH_2", rb: 2}
  - {c: NH_2}
decorate:
  boxes: [{rows: [2, 3, 4, 5, 6, 7], name: R}]
  colors: {5: cyan, 6: {r: cyan}, 7: cyan}
tags: [amino_acid, basic]
notes_zh: "Arg / R。胍基 pKa ≈ 12.5（最鹼）；兒童條件必需。尿素循環中 arginase → urea + ornithine；NOS → NO。生糖。"
status: approved