notes_zh: Collagen 的 Gly-X-Y 中 Y 位常為 Hyp：prolyl 4-hydroxylase 在 ER 內修飾（轉譯後），需 Fe²⁺、α-KG、O₂ 與 vitamin C（維持 Fe²⁺）。Hyp 的 OH 形成氫鍵穩定三股螺旋；缺 vitamin C → scurvy（牙齦出血、傷口難癒）。HIF-1α 的 Pro 羥化則標記它被降解。
