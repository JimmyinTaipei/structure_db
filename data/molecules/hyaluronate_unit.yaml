notes_zh: 重複雙醣：[–4)GlcA(β1→3)GlcNAc(β1–]ₙ，圖為 GlcNAc(β1→4)GlcA 這一半。唯一「不含硫酸」、也不以共價鍵接 core protein 的 GAG；分子極大、高度水合 → 關節液潤滑、玻璃體、軟骨中作為 aggrecan 的骨架（經 link protein 非共價結合）。嚴格說玻尿酸是 GAG，不是 proteoglycan。
