notes_zh: UDP-glucose 的 C6 被 UDP-glucose dehydrogenase 氧化成羧酸。活化的 glucuronate 供體：bilirubin、藥物、類固醇的 phase II 結合（UDP-glucuronosyltransferase），以及 GAG（hyaluronate、chondroitin、heparin）的 GlcA 單元。植物與多數動物再經 uronic
  acid pathway 合成 vitamin C；人缺 L-gulonolactone oxidase。
