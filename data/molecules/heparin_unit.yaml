notes_zh: IdoA-2-sulfate(α1→4)GlcNS-6-sulfate，單元間 α1→4。帶負電密度最高的生物分子。由 mast cell 分泌；結合 antithrombin III 使其抑制 thrombin、factor Xa 的速度加快約 1000 倍 → 抗凝血。Heparan sulfate 結構相近但硫酸較少、GlcA 較多，分布在細胞表面（syndecan）。
