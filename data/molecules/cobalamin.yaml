notes_zh: 示意圖（只驗證 SMILES 格式，不檢查原子數）：corrin 環中央一個 Co，下方配位 DMB，上方配位 R（洋紅）決定功能。methylcobalamin：methionine synthase（Hcy → Met，同時 N⁵-CH₃-THF → THF；缺乏 → methyl-folate trap）。adenosylcobalamin：methylmalonyl-CoA
  mutase（→ succinyl-CoA；缺乏 → MMA ↑、神經症狀）。吸收需胃壁細胞的 intrinsic factor、迴腸末端。缺乏：巨球性貧血 + 亞急性聯合變性；Hcy ↑ 且 MMA ↑。
