id: histidine
name: Histidine
aliases: [His, H, 組胺酸]
smiles: "[NH3+][C@@H](Cc1c[nH]cn1)C(=O)[O-]"
chain:                              # Lehninger：COO⁻ 在上、H₃N⁺ 在左（L 型）、R 基在下
  - {c: "COO^-"}
  - {c: C, l: "^+H_3N", r: H}
  - {c: CH_2}
  - {ring: "[*]c1c[nH]cn1"}
decorate:
  boxes: [{rows: [2, 3], name: R}]
  colors: {3: {ring: cyan}}
tags: [amino_acid, basic]
notes_zh: "His / H。必需；imidazole pKa ≈ 6.0，接近生理 pH → 酵素活性中心的酸鹼催化、Hb 的緩衝。→ histamine。生糖。"
status: approved