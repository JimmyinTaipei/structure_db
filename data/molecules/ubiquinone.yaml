notes_zh: 脂溶性的電子載體，在內膜中自由擴散。收集 Complex I、II、mitochondrial G3P DH、ETF:Q oxidoreductase（脂肪酸 β 氧化）、DHODH 的電子，交給 Complex III。可一次收 1 個電子（semiquinone •Q⁻）或 2 個電子＋2 H⁺（QH₂）。statin 也會減少 CoQ 合成（共用 mevalonate 路徑）。圖中
  R 是類異戊二烯尾巴（人類 10 個單位），以示意圖繪製。
