notes_zh: 細菌細胞壁：NAG(β1→4)NAM 交替（雜多醣）。NAM = GlcNAc 的 C3–O 接 D-lactyl（圖中 OR，R = –CH(CH₃)COO⁻），lactyl 的 COO⁻ 再接四胜肽（L-Ala–D-Glu–L-Lys/DAP–D-Ala），胜肽之間交聯。Lysozyme 切 NAM–NAG 的 β1→4 鍵；penicillin 抑制交聯的 transpeptidase。
