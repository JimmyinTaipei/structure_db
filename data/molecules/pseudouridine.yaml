notes_zh: Uridine 的異構物：鹼基轉 180°，改以 C5 接 C1′（C-醣苷鍵），多出一個 N1–H 氫鍵供體。H/ACA snoRNA + dyskerin（真核）或 pseudouridine synthase 催化，不需要能量、分子量不變。最常見的 RNA 修飾：tRNA 的 TΨC 環、rRNA、snRNA。
