notes_zh: 20 碳，β-ionone 環＋全反式多烯側鏈，末端 CH₂OH。以 retinyl ester 存於肝 stellate（Ito）細胞，血中由 retinol-binding protein 運送。缺乏：夜盲、乾眼症（xerophthalmia）、Bitot spots、免疫力下降；過量：顱內壓上升、肝毒性、致畸胎（isotretinoin）。
