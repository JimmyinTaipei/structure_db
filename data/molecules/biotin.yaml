notes_zh: 羧基以醯胺鍵接在酵素的 Lys 上（biocytin，holocarboxylase synthetase）。洋紅：N1′，ATP + HCO₃⁻ 先在這裡形成 carboxybiotin，再把 CO₂ 轉給受質。酵素：pyruvate carboxylase、acetyl-CoA carboxylase、propionyl-CoA carboxylase（ABC：ATP、Biotin、CO₂）。生蛋白的
