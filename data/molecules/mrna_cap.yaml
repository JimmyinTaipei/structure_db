notes_zh: 7-甲基鳥苷（m⁷G，N7 帶正電）以 5′–5′ 三磷酸鍵接在 mRNA 第一個核苷酸（此處為 A）上。Cap 0 只有 m⁷G；cap 1 第一個核苷酸 2′-O-甲基化（如圖）；cap 2 第二個也甲基化。甲基都來自 SAM。功能：抗 5′ 外切酶、出核（CBC）、轉譯起始（eIF4E）、第一個 intron 的剪接。Rib = 其餘 RNA。
