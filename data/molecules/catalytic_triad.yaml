notes_zh: Chymotrypsin／trypsin／elastase 的催化三元組：Asp102 的 COO⁻ 固定 His57 方向並穩定其正電；His57 當 general base 拉走 Ser195 的 H⁺；Ser195 的 O⁻ 親核攻擊受質羰基 C → 四面體中間物（oxyanion hole：Gly193、Ser195 主鏈 NH 穩定 O⁻）→ acyl-enzyme（burst）→
  水解（慢）。DIFP 共價修飾 Ser195、TPCK 修飾 His57。專一性口袋：trypsin（Asp189，切 Lys/Arg 後）、chymotrypsin（疏水大，切 Phe/Tyr/Trp 後）、elastase（Val/Thr 填塞，切小 AA 後）。
