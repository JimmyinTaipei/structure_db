notes_zh: 活性形式。腎近曲小管的 1α-hydroxylase（CYP27B1）：PTH ↑、低磷 → 活化；calcitriol 本身與 FGF23 → 抑制。洋紅：1α-OH 與 25-OH。作用於核受體 VDR：腸道吸收 Ca²⁺ 與磷 ↑。缺乏：佝僂病（兒童）、骨軟化症（成人）；肉芽腫（sarcoidosis）的巨噬細胞也有 1α-hydroxylase → 高血鈣。
