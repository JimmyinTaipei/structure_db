notes_zh: GSH：γ-Glu-Cys-Gly 三胜肽。Glu 以側鏈 γ-COOH（不是 α-COOH）接 Cys → γ-胜肽鍵，不被一般 protease 切。–SH 是還原劑：2 GSH → GSSG（glutathione peroxidase 清除 H₂O₂，含 Se）；glutathione reductase 用 NADPH（來自 PPP，G6PD 缺乏 → 溶血）把 GSSG
  還原回 GSH。
