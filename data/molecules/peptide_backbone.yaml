notes_zh: 多肽主鏈：每個胜肽鍵連同兩側 Cα 共平面（剛性、幾乎都是 trans）。只有 Cα 兩側的單鍵可旋轉：φ（N–Cα）與 ψ（Cα–C）。允許的 φ/ψ 組合見 Ramachandran plot。C–N 1.32 Å，介於單鍵 1.49 Å 與雙鍵 1.27 Å 之間。
