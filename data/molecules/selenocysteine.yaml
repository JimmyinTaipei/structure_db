notes_zh: 第 21 個胺基酸（Sec, U）：Cys 的 S 換成 Se，pK_a ≈ 5.2（pH 7 帶負電，更強的親核基）。由 UGA（原為終止密碼）配合 SECIS 元件重新編碼。存在於 glutathione peroxidase、thioredoxin reductase、deiodinase（甲狀腺素）。第 22 個為 pyrrolysine（UAG，僅古菌）。
