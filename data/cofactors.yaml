# 輔因子表：反應圖上用彎箭頭畫的小分子。
# smiles 只需畫出「會變化的部分」，其餘以虛擬原子 [n*] 代表（平衡檢查時視為同一個 R 基團）：
#   [1*] = CoA 的其餘部分     [2*] = NAD 的 ADP-ribose     [3*] = FAD 的 ribityl-ADP
#   [9*] = 肝醣其餘部分（glycogen_n / glycogen_n1）
#   [10*] = CoQ 的類異戊二烯尾巴  [13*] = BH4 側鏈  [14*] = SAM/SAH 其餘部分
#   [15*] = cytochrome c 蛋白質   [16*] = glutathione 其餘部分（GSH = S[16*]，LTC4 畫成 –S–G）
#   [17*] = DNA 中的去氧核糖（損傷鹼基畫成 –dR）   [18*] = MGMT 蛋白（Cys–S 接甲基）
#   [4*] = adenosine          [5*] = guanosine             [6*] = NADP 的 2'-P-ADP-ribose
# label 使用 text 標記語法（_ 下標、^ 上標）。
# molecule：選填，網頁上點輔因子會跳到這個分子的結構頁（驗證會確認片段真的在分子裡）。

NAD+:   {label: "NAD^+",  smiles: "NC(=O)c1ccc[n+]([2*])c1", molecule: nad}
NADH:   {label: "NADH",   smiles: "NC(=O)C1=CN([2*])C=CC1", molecule: nadh}
NADP+:  {label: "NADP^+", smiles: "NC(=O)c1ccc[n+]([6*])c1", molecule: nadp}
