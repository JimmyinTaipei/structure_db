card_zh:
  location: 粒線體內膜
  type: 氧化還原＋質子幫浦（每 2 e⁻ 打出 4 H⁺）
  cofactors: FMN → 一串 Fe-S cluster → Q
  deficiency:
  - rotenone（殺蟲劑、魚藤酮）、amytal（amobarbital）、piericidin A 抑制 → NADH 無法氧化，但 succinate 仍可經 Complex II 進來
  - Leber hereditary optic neuropathy（LHON）：粒線體 DNA 的 Complex I 基因突變，母系遺傳
  exam_points:
  - NADH 的 P/O ≈ 2.5（10 H⁺ / 4 H⁺ per ATP）
  - Complex I、III、IV 是三個質子幫浦，II 不是
