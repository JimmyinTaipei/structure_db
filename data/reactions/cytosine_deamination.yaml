id: cytosine_deamination
title: Cytosine deamination
substrates:
- cytosine
products:
- uracil
- ammonium
cofactors_in:
- H2O
- H+
enzyme: spontaneous (hydrolytic) deamination
reversible: false
decorate:
  cytosine:
    highlight:
    - smarts: '[NH2:1]c1nc(=O)[nH]cc1'
      color: magenta
  ammonium:
    colors:
      0: magenta
  H2O:
    colors:
      0: cyan
  uracil:
    highlight:
    - smarts: '[O:1]=c1[cH][cH][nH]c(=O)[nH]1'
      color: cyan
card_zh:
  type: C4 的 –NH₂（洋紅）以 NH₄⁺ 離開，H₂O 的 O（青）成為 C4=O
  exam_points:
  - DNA 中出現 U → uracil-DNA glycosylase 辨認移除（BER）；這也是 DNA 用 T 而不用 U 的原因
  - 未修復 → C:G → T:A 轉換突變
tags:
- nucleotide
- degradation
status: pending
