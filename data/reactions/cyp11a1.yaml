card_zh:
  location: 粒線體內膜（adrenodoxin 傳電子）
  type: 三次單氧化：22R-OH、20,22-diOH，再切斷 C20–C22
  regulation: ACTH（腎上腺）、LH（Leydig、黃體）經 cAMP；真正的限速是 StAR 把膽固醇送到粒線體內膜
  deficiency:
  - StAR 或 CYP11A1 缺乏 → lipoid CAH：所有固醇類荷爾蒙 ↓，腎上腺充滿膽固醇
