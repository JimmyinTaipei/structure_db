substrates: [{id: acetaldehyde, n: 2, view: skeletal}]
products: [crotonaldehyde, water]
prosthetic: ["NaOH"]
conditions: "heat"
reversible: false
decorate:
  crotonaldehyde: {smarts: '[CH]=[CH]'}
