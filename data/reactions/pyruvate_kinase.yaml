card_zh:
  location: 細胞質
  type: 受質層次磷酸化（第 2 次產 ATP）
  deltaG: "ΔG'° = −31.4 kJ/mol，不可逆（調控點）"
  mechanism: "產物先是 enolpyruvate，自發 tautomerize 成 keto 型 pyruvate（這一步提供大部分自由能）"
  regulation: "活化：F1,6BP（feed-forward）。抑制：ATP、alanine、acetyl-CoA、長鏈脂肪酸。肝臟 L 型：glucagon → PKA 磷酸化 → 失活"
  deficiency: "PK 缺乏 → 溶血性貧血（紅血球最常見的糖解酵素缺乏），2,3-BPG ↑"
  exam_points:
    - "糖解淨產：2 ATP、2 NADH、2 pyruvate／glucose"
    - "糖質新生需繞道：pyruvate carboxylase ＋ PEPCK"
