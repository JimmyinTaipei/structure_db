id: pyruvate_decarboxylase
title: Pyruvate → Acetaldehyde (pyruvate decarboxylase)
substrates:
- pyruvate
products:
- acetaldehyde
- co2
cofactors_in:
- H+
prosthetic:
- TPP,
- Mg^{2+}
enzyme: pyruvate decarboxylase
reversible: false
