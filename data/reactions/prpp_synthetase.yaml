id: prpp_synthetase
title: "Ribose 5-phosphate + ATP → PRPP + AMP (PRPP synthetase)"
substrates: [ribose_5p]
products: [prpp]
cofactors_in: [ATP]
cofactors_out: [AMP]
extra_out: [H+]          # 生理 pH 下釋出的 H⁺（不畫，只參與平衡）
enzyme: "ribose phosphate\npyrophosphokinase\n(PRPP synthetase)"
reversible: false
decorate:
  ATP:
    colors: {0: magenta}
  prpp:
    colors:
      d1: [magenta, '{P}–{P}']
card_zh:
  location: 細胞質
  type: "焦磷酸轉移：ATP 的 β,γ-焦磷酸整塊轉到 C1-OH（α 構形）"
  regulation: "ADP、GDP 等嘌呤核苷酸抑制；Pi 活化"
  deficiency: "PRPP synthetase 過度活化（功能獲得突變）→ PRPP ↑ → 嘌呤過度合成 → 高尿酸、痛風"
  exam_points:
    - "PRPP 是嘌呤／嘧啶從頭合成與救援途徑（HGPRT、APRT、OPRT）的共同原料"
    - "原料 R5P 來自 PPP 的氧化相"
tags: [nucleotide, purine, pyrimidine]
status: pending
