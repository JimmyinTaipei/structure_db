card_zh:
  type: 硫醇–雙硫交換：還原劑的 –SH 把 –S–S– 還原成兩個 –SH（可逆）
  exam_points:
  - SDS-PAGE 前加 β-ME/DTT 才會把以 –S–S– 相連的次單元分開
  - Anfinsen（RNase A）：urea + β-ME 變性，移除後自發復性 → 一級結構決定三級結構
  - performic acid 則把 –S–S– 氧化成 2 個 cysteic acid（–SO₃⁻，不可逆）
