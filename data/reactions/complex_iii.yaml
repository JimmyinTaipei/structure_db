card_zh:
  location: 粒線體內膜；cyt c 在膜間腔側
  type: 氧化還原＋質子轉移（Q cycle）
  mechanism: Q cycle：QH₂ 在外側（Qo）放出 2 H⁺ 到膜間腔；一個 e⁻ 經 Rieske Fe-S → cyt c₁ → cyt c，另一個經 cyt b_L → b_H 到內側（Qi）把 Q 還原。兩輪合計：2 QH₂ 氧化、1 Q 還原，4 H⁺ 到膜間腔、2 個 cyt c 被還原
  deficiency:
  - antimycin A 抑制 Qi 位；myxothiazol 抑制 Qo 位
  exam_points:
  - 把 2 e⁻ 載體（QH₂）轉成 1 e⁻ 載體（cyt c）
  - cyt c 是水溶性周邊蛋白；釋放到細胞質 → 活化 caspase-9（內在性凋亡）
