id: adenylyl_cyclase
title: ATP → cAMP + PPi (adenylyl cyclase)
substrates:
- atp_n
products:
- camp
cofactors_out:
- PPi
prosthetic:
- Mg^{2+}
enzyme: adenylyl cyclase
reversible: false
decorate:
  atp_n:
    colors:
      d3:
      - cyan
      - O
      u4:
      - magenta
      - '{P}–{P}'
  PPi:
    colors:
      0: magenta
  camp:
    highlight:
    - smarts: P1(=O)([O-])OCC2OC(n)C(O)C2[O:1]1
