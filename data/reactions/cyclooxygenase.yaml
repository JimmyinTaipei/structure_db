id: cyclooxygenase
title: Arachidonate → PGG₂ (COX, cyclooxygenase activity)
substrates:
- arachidonate
products:
- pgg2
cofactors_in:
- 2O2
enzyme: 'cyclooxygenase

  (COX-1, COX-2)'
reversible: false
decorate:
  2O2:
    colors:
      0: magenta
  pgg2:
    highlight:
    - smarts: '[OX2:1][OX2:2]'
      color: magenta
card_zh:
  location: ER 膜（PGH synthase）
  type: 雙氧化（環化＋15-OOH）
  regulation: COX-1 常駐（胃黏膜、血小板、腎）；COX-2 誘導型（發炎、cytokine）
  deficiency:
  - aspirin：不可逆乙醯化 COX Ser530（低劑量 → 血小板 TXA₂ ↓）
  - NSAID（ibuprofen、naproxen）：可逆競爭抑制；celecoxib：選擇性 COX-2（胃副作用少、心血管風險 ↑）
  - corticosteroid：抑制 PLA₂（annexin/lipocortin）並減少 COX-2 表現
  exam_points:
  - arachidonate 先由 cPLA₂ 從膜磷脂 sn-2 釋出（限速）
tags:
- lipid_metabolism
- eicosanoid_synthesis
status: pending
