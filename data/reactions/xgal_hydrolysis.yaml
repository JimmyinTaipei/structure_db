card_zh:
  type: 水解 β-糖苷鍵：indoxyl 的 O（青）留在 indoxyl 上；H₂O（洋紅）的 OH 接到 galactose C1
  exam_points:
  - 藍白篩選：lacZα 完整 → 有 β-gal 活性 → 藍；插入片段破壞 lacZα → 白（含重組質體）
  - 需 IPTG 解除 LacI 抑制；α-complementation：宿主提供 lacZΔM15
