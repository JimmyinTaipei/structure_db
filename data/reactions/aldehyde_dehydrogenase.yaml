card_zh:
  location: 肝細胞粒線體（ALDH2）
  type: 氧化（NAD⁺）
  deficiency:
  - ALDH2*2（Glu504Lys，東亞人常見）：乙醛堆積 → 臉紅、心悸、噁心（亞洲紅臉）；也增加食道癌風險
  - disulfiram 抑制 ALDH → 喝酒即出現類似反應（戒酒藥）；metronidazole、某些 cephalosporin、sulfonylurea 也會
  exam_points:
  - 乙醛有毒：與蛋白質形成 adduct → 肝損傷
