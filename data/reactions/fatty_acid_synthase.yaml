card_zh:
  location: 細胞質（肝、脂肪、乳腺）
  type: 多功能酵素（同源二聚體），醯基接在 ACP 的 phosphopantetheine 上
  mechanism: 每輪：縮合（KS，放出 CO₂）→ 還原（KR，NADPH）→ 脫水（DH）→ 還原（ER，NADPH）；與 β 氧化方向相反，中間物為 D-3-hydroxyacyl
  exam_points:
  - 每加 2 碳耗 2 NADPH
  - 產物是 palmitate（16:0）；延長在 ER、去飽和（Δ9 等）也在 ER
  - 人類不能在 Δ9 之後加雙鍵 → linoleate、α-linolenate 為必需脂肪酸
