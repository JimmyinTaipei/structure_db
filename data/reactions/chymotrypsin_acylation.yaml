card_zh:
  type: Ser195 的 O（青）親核攻擊胜肽鍵羰基 → 四面體中間物（氧陰離子洞穩定）→ 醯基-酵素；醯胺 N（洋紅）帶著 C 端片段離開
  exam_points:
  - 催化三聯體：Asp102 定位並穩定 His57，His57 當廣義鹼拔 Ser195 的 H（之後當廣義酸給離去的 N）
  - 氧陰離子洞：Gly193 與 Ser195 主鏈 NH 以氫鍵穩定四面體中間物的 O⁻
  - Burst kinetics：第一個產物（胺）快速釋出，去醯化較慢（速率限制）
