notes_zh: HbS：β-globin 第 6 個密碼子 GAG（Glu）→ GTG（Val），破壞 MstII 位點（CCTNAGG）。以 β-globin 探針做 Southern：正常 1.15 kb（+ 0.2 kb），鐮刀 1.35 kb；AA 一條 1.15、SS 一條 1.35、AS 兩條。RFLP 也用於連鎖分析與親子鑑定；現多以 PCR 加 STR 取代。
