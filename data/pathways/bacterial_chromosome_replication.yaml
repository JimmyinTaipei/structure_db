notes_zh: Gyrase（topo II，耗 ATP）引入負超螺旋（ΔLk = −2），讓 oriC 容易解開。雙向複製形成 θ 結構，兩個複製叉在終點區（Ter 序列＋Tus 蛋白阻擋）會合。複製完成的兩個環互相套住（catenane），由 topo IV 切開分離。E. coli 複製叉 ~1000 nt/s，真核 ~50 nt/s。
