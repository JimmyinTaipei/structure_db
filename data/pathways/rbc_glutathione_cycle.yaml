notes_zh: 紅血球沒有粒線體，NADPH 只能來自 PPP 的 G6PD。NADPH → glutathione reductase（FAD）把 GSSG 還原成 2 GSH → glutathione peroxidase（含 selenocysteine）用 GSH 把 H₂O₂ 還原成水。G6PD 缺乏（X 性聯、最常見酵素缺陷；抗瘧疾）：遇氧化壓力（primaquine、sulfonamide、dapsone、蠶豆的
  divicine、感染）→ GSH 不足 → Hb 氧化沉澱（Heinz bodies）、膜受損 → 溶血（bite cells）。NADPH 其他用途：脂肪酸與固醇合成、P450、NOS、吞噬細胞 NADPH oxidase（呼吸爆發；缺陷 → 慢性肉芽腫病）。
