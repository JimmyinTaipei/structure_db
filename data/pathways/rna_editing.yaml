notes_zh: 'C→U：APOBEC-1 使 apoB mRNA codon 2153 CAA → UAA，小腸產生 apoB-48（chylomicron），肝臟不編輯產生 apoB-100（VLDL/LDL）。A→I：ADAR 作用於雙股 RNA，I 讀成 G（GluR-B Q/R 位，CAG→CIG：Gln→Arg）。U 插入／刪除：錐蟲粒線體以 guide RNA 為模板（最早發現的編輯）。

  【補充】Editing changes the RNA sequence after transcription (the gene still reads CAA). APOBEC family also includes APOBEC3G (antiviral; HIV Vif degrades it) and AID (somatic hypermutation, class switching).
  The first editing found was U insertion in trypanosomes. Compare CRISPR–Cas9: a guide RNA edits DNA.

  【補充】GluR-B (AMPA receptor) Q/R site: CAG (Gln) → CIG = CGG (Arg) → Ca^{2+}-impermeable channel; also 5-HT_{2C} receptor; tRNA wobble I (ADAT)'
