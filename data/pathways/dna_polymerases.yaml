notes_zh: 所有 DNA polymerase：5′→3′ 合成、需要模板與引子、兩個 Mg²⁺。3′→5′ exo（校對）例外：反轉錄酶、Taq、Pol α、Pol β、Pol IV/V、RNA 依賴的 RNA pol。5′→3′ exo：E. coli Pol I（移除引子、修復），Taq 也有。真核引子主要由 Pol δ 股置換 + FEN1（長 flap 加 Dna2）移除，RNase
  H1 為輔。
