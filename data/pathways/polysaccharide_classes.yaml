notes_zh: 同元多醣：starch（amylose、amylopectin）、glycogen、cellulose、chitin、dextran、inulin（fructose）。雜多醣：GAG（hyaluronate、chondroitin、dermatan、heparin、keratan）、peptidoglycan、agarose。考點：玻尿酸是 GAG（雜多醣），本身不是 proteoglycan；chitin
  是同元多醣（只有 GlcNAc）。
