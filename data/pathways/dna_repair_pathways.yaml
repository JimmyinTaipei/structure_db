notes_zh: 依損傷選擇修復途徑：錯配 → MMR；單一鹼基 → BER；大型扭曲 → NER；甲基 → MGMT（直接）；雙股斷裂 → HR（S/G2，無誤）或 NHEJ（G1，易錯）；無法修復時以 TLS 越過。相關疾病：XP（NER）、Lynch（MMR）、BRCA1/2（HR）、ataxia telangiectasia（ATM）、Bloom（BLM）、Werner（WRN）、Fanconi
  anemia（交聯修復）。
