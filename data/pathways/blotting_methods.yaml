notes_zh: 電泳分離 → 轉漬到膜（nitrocellulose / nylon）→ 以標記探針或抗體雜交 → 偵測（放射自顯影、化學發光）。Southern（DNA；E. Southern）：限制酶切 → 電泳 → 鹼變性 → 轉漬 → DNA 探針；考題順序：切割 → 電泳 → 轉漬 → 雜交 → 自顯影。Northern：RNA（不需限制酶）。Western：SDS-PAGE 分離蛋白質
  → 一級、二級抗體。Southwestern：蛋白質以 DNA 探針偵測（DNA 結合蛋白）。
