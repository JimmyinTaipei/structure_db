notes_zh: 'N 端 signal sequence 冒出 → SRP（7SL RNA + 蛋白，GTPase）結合、轉譯暫停 → SRP receptor（GTP）把核糖體送到 Sec61 translocon → SRP 水解 GTP 離開、轉譯恢復 → 胜肽穿膜進入內腔 → signal peptidase 切除訊號 → OST 由 dolichol-PP 轉移 N-glycan 到 Asn-X-Ser/Thr（tunicamycin
  抑制）→ BiP 協助摺疊 → Golgi。細菌：SRP（4.5S RNA）/FtsY、SecB + SecA → SecYEG、Tat（已摺疊）。

  【補充】SRP = 7SL RNA (Alu-like) + 6 proteins; SRP54 binds the hydrophobic signal (+ charge, 10–15 hydrophobic aa) and is a GTPase, as is the SRP receptor; GTP hydrolysis releases both. Proteins made this
  way: secreted, plasma-membrane, ER / Golgi, lysosomal. Tunicamycin blocks the first step of dolichol-PP-oligosaccharide synthesis (N-glycosylation). Bacteria: SRP (4.5S RNA) + FtsY → SecYEG co-translationally;
  post-translational SecB (chaperone) + SecA (ATPase) → SecYEG; folded proteins via Tat (twin-Arg signal).

  【補充】translation resumes; signal peptidase cuts; OST adds the N-glycan (Asn-X-Ser/Thr) from dolichol-PP; BiP folds'
