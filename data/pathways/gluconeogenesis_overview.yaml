notes_zh: 糖解的三個不可逆步驟（hexokinase、PFK-1、pyruvate kinase）以四個酵素繞過：PC + PEPCK、FBPase-1、G6Pase。2 pyruvate → glucose 共耗 4 ATP + 2 GTP + 2 NADH。原料：lactate（Cori）、Ala（glucose–alanine cycle）、glycerol、生糖胺基酸、propionyl-CoA（奇數碳脂肪酸）；偶數碳脂肪酸（acetyl-CoA）不能淨生成葡萄糖。
