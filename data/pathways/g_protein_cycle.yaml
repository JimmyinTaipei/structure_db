id: g_protein_cycle
title: G protein cycle
layout: cycle
radius: 2.1
cell_size: 5.2
start_angle: -90
center_text: 'Gα

  GTPase

  switch'
nodes:
- id: gdp
  text: 'Gαβγ–GDP

    (inactive)'
  kind: protein
- id: ex
  text: 'Receptor (GPCR) + ligand

    GDP → GTP exchange'
  kind: name
- id: gtp
  text: 'Gα–GTP + βγ

    (active)'
  kind: protein
- id: eff
  text: 'Effector: adenylyl cyclase

    (cAMP), PLC-β …'
  kind: name
- id: hyd
  text: 'GTP → GDP + P_i

    (intrinsic GTPase, RGS)'
  kind: name
edges:
- from: gdp
  to: ex
- from: ex
  to: gtp
- from: gtp
  to: eff
- from: eff
  to: hyd
- from: hyd
  to: gdp
tags:
- enzyme
- allostery
notes_zh: GPCR 活化 → 促使 Gα 釋出 GDP、結合 GTP（GEF 作用）→ Gα–GTP 與 βγ 分開並各自作用（Gs 活化、Gi 抑制 adenylyl cyclase；Gq 活化 PLC-β）。Gα 本身的 GTPase 把 GTP 水解成 GDP → 回到三聚體（關閉）。霍亂毒素：Gs ADP-ribosylation → GTPase 失效 → 持續活化；百日咳毒素：Gi
  無法活化。PKA：4 cAMP 結合 2 個 R 次單元 → 釋出 2 個活性 C 次單元。
status: pending
