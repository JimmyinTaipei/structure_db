notes_zh: '原核：streptomycin（30S，誤讀、高濃度阻斷起始）、tetracycline（30S A 位）、chloramphenicol（50S peptidyl transferase，也抑制粒線體）、erythromycin（50S 出口通道）、linezolid、clindamycin、fusidic acid（EF-G）。兩者：puromycin（仿 Tyr-tRNA，提早終止）。真核：cycloheximide（60S）、白喉毒素（eEF2
  ADP-ribosylation）、ricin（28S rRNA 去嘌呤）。

  【補充】Eukaryotic-only: cycloheximide (60S); diphtheria toxin and Pseudomonas exotoxin A ADP-ribosylate diphthamide (modified His) of eEF2 (NAD⁺ → nicotinamide); ricin and Shiga toxin are N-glycosidases
  that depurinate one A in 28S rRNA (sarcin–ricin loop). Chloramphenicol also hits mitochondrial ribosomes (gray baby syndrome). Aminoglycosides bind 16S rRNA near A1492/A1493 (decoding); tetracycline binds
  16S; macrolides, chloramphenicol, linezolid bind 23S.'
