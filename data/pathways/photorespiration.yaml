notes_zh: 光呼吸：Rubisco 把 O₂ 加到 RuBP，產生 2-phosphoglycolate；回收路徑跨三個胞器，最後 2 個 2-PG（4 C）只換回 1 個 3-PG（3 C），損失 1 個 CO₂ 與 NH₃，消耗 ATP。高溫、乾燥（氣孔關閉 → CO₂ 低）時更嚴重；C4 與 CAM 植物用 PEP carboxylase 先固定 CO₂ 來避免。
