notes_zh: Met → SAM（甲基供體）→ SAH → Hcy。Hcy 再甲基化（methionine synthase：B12 + CH₃-THF）或經 transsulfuration（CBS、γ-lyase：B6）變成 Cys。Hcy ↑：B12、folate、B6 缺乏、CBS 或 MTHFR 缺陷。B12 缺乏 → methyl-folate trap。
