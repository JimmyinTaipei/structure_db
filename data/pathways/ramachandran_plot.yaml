notes_zh: Ramachandran plot：φ（N–Cα）與 ψ（Cα–C）的允許組合（色塊為允許區，示意）。左上大片為 β 區，左下為右手 α-helix（φ ≈ −57°、ψ ≈ −47°），右上小區為左手 α-helix（少見，多為 Gly）。Gly 沒有側鏈，幾乎可落在任何區域；Pro 的 φ 固定在約 −60°。
