notes_zh: sRNA（50–300 nt，反式）：Hfq 協助與 mRNA 配對，蓋住 SD → 抑制轉譯或促使分解（OxyS 抑制 rpoS；DsrA、RprA 打開 rpoS 的髮夾反而促進）。Riboswitch（順式，mRNA 5′UTR 本身）：aptamer 結合代謝物（TPP、FMN、SAM、lysine）→ expression platform 改變構形：形成終止子（轉錄）或把
  SD 藏進髮夾（轉譯）；真菌、植物的 TPP riboswitch 也可改變剪接。
