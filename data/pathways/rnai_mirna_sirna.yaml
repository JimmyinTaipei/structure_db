notes_zh: miRNA：Pol II 轉錄 pri-miRNA（有 cap、poly(A)）→ 核內 Drosha–DGCR8 切成 ~70 nt pre-miRNA → Exportin-5（Ran-GTP）出核 → Dicer 切成 21–23 nt 雙股 → guide strand 進 RISC（Argonaute）→ seed（2–8）與 3′UTR 部分配對 → 抑制轉譯、去 poly(A)、分解（P
  bodies）。siRNA：外來長 dsRNA → Dicer → RISC（Ago2 slicer）→ 完全配對 → 切斷 mRNA（RNAi，基因 knock-down；Fire & Mello）。piRNA：PIWI，生殖細胞抑制轉位子。
