notes_zh: 載體至少需複製起點、選擇標記、多選殖位點。容量：plasmid < λ < cosmid < BAC < YAC。Shuttle vector 兩種起點；expression vector 帶啟動子與 RBS；真核表現另有 CMV promoter（哺乳類），E. coli 載體（如 pET）則不需要。
