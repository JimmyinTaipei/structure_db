notes_zh: 'Pol III 轉錄（內部啟動子 A、B box）。RNase P（核酶）切 5′ leader；3′ trailer：E. coli 由 RNase D 等外切酶、真核由 RNase Z（內切）；CCA 由 tRNA nucleotidyltransferase 加上（E. coli 基因已編碼）；真核部分 pre-tRNA 在反密碼子環有 intron（endonuclease
  + ligase）；鹼基修飾：D、Ψ、T、I、m¹G。

  【補充】Pol III transcribes tRNA genes (internal promoter: A and B boxes). Order: RNase P (5′) and RNase Z / exonucleases (3′) → CCA → splicing → modifications → export. E. coli: tRNAs also come out of rRNA
  operons; CCA is encoded (nucleotidyltransferase only repairs it). RNase P = protein + catalytic M1 RNA. The amino acid is attached to the 3′-terminal A (2′- or 3′-OH) by aminoacyl-tRNA synthetase (round
  21).'
