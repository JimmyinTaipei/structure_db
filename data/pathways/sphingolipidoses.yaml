notes_zh: 溶小體由非還原端逐一切下糖。全部體染色體隱性，只有 Fabry 是 X-linked。櫻桃紅點：Tay-Sachs、Niemann-Pick（＋GM1、Sandhoff）。肝脾腫大：Gaucher、Niemann-Pick（Tay-Sachs 沒有）。Ashkenazi Jews：Tay-Sachs、Niemann-Pick A、Gaucher。脫髓鞘：Krabbe（globoid
  cell）、metachromatic leukodystrophy（sulfatide）。Gaucher 治療：酵素替代（imiglucerase）或受質減少（miglustat、eliglustat）。
