notes_zh: 催化三聯體（chymotrypsin 編號）：Asp102 以氫鍵（低障壁氫鍵）定位並穩定 His57 → His57 當廣義鹼拔取 Ser195 –OH 的質子 → Ser195 O⁻ 親核攻擊胜肽鍵的羰基碳 → 四面體中間物，O⁻ 嵌入氧陰離子洞（Gly193 與 Ser195 主鏈 NH 兩個氫鍵穩定過渡態）→ His57（此時為廣義酸）把質子給離去的胺 → 醯基-酵素；第二步由
  His57 活化水進行去醯化。兩步反應見 chymotrypsin_acylation、chymotrypsin_deacylation。S1 口袋決定專一性：chymotrypsin 深而疏水（Phe、Trp、Tyr）；trypsin 底部 Asp189（Lys、Arg）；elastase 被 Val216、Thr226 填淺（Ala、Gly 等小側鏈）。共同點：都由 zymogen 活化（trypsinogen
  由 enteropeptidase 切）；DFP 共價修飾 Ser195 而不可逆抑制。Subtilisin 為趨同演化的例子（不同摺疊、同樣三聯體）。
