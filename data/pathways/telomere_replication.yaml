notes_zh: '末端複製問題：延遲股最後的 RNA 引子移除後無法補齊 → 每次分裂端粒變短（並留下 3′ overhang）。Telomerase：TERT（反轉錄酶）＋ 自帶 RNA 模板（人 3′-AAUCCC-5′），把 3′ 端延長 TTAGGG 重複；之後 Pol α–primase 補上 C-rich 股。端粒 10–20 kb，3′ overhang > 100 nt，折成 T-loop（overhang
  侵入雙股形成 D-loop）或 G-quadruplex（K⁺ 穩定），由 shelterin（TRF1、TRF2、POT1）保護。生殖細胞、幹細胞與多數癌細胞有 telomerase 活性；體細胞沒有 → 老化。

  【補充】Then Pol α–primase fills in the C-rich strand; the end folds into a T-loop (D-loop) or G-quadruplex, protected by shelterin (TRF1/2, POT1). Telomerase active in germ cells, stem cells and ~90 % of
  cancers; somatic cells lack it → senescence. Telomere 10–20 kb, overhang > 100 nt.'
