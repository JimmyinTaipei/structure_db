notes_zh: 'CPSF 認 AAUAAA，CstF 認下游 GU-rich；在 AAUAAA 後 10–30 nt（常在 CA 之後）切開，poly(A) polymerase（不需模板，ATP）加上 ~200–250 A，PABP 包覆。下游 RNA 被 Xrn2 分解並使 Pol II 終止（torpedo）。Poly(A)：穩定、出核、轉譯（PABP–eIF4G）；histone mRNA
  無 poly(A)（莖環）。

  【補充】CPSF binds AAUAAA; CstF binds the GU/U-rich element ~30 nt downstream; CPSF-73 cuts 10–30 nt after AAUAAA (usually after CA). Poly(A): stability, export, translation (PABP–eIF4G closes the loop);
  shortening (deadenylation) starts decay. Histone mRNAs have a stem-loop instead. Alternative poly(A) sites change the 3′ UTR (miRNA sites) or the C terminus (IgM membrane vs secreted). Bacterial poly(A)
  instead marks RNA for decay.'
