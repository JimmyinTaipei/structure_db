notes_zh: 第二傳訊者：cAMP、cGMP、IP₃、DAG、Ca²⁺、NO（可兼第一與第二傳訊者）、ceramide、cADP-ribose；GTP、ATP、insulin 不是。Ser/Thr kinase 家族與活化物：PKA（cAMP）、PKB/Akt（PIP₃）、PKC（DAG、PS、Ca²⁺；phorbol ester TPA 活化 → 腫瘤促進劑）、PKG（cGMP）、CaMK（Ca²⁺–calmodulin）。PKC
  三類：conventional（PS、DAG、Ca²⁺）、novel（PS、DAG）、atypical（都不需）。Calmodulin：4 個 Ca²⁺ 結合 EF hand（helix-loop-helix）；也是 phosphorylase kinase 的 δ 次單元。
