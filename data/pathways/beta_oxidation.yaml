notes_zh: 氧化（FAD）→ 加水 → 氧化（NAD⁺）→ 硫解。每輪少 2 碳，產生 1 FADH₂、1 NADH、1 acetyl-CoA。palmitate：7 輪 → 8 acetyl-CoA，淨 106 ATP。不飽和脂肪酸另需 enoyl-CoA isomerase（與 2,4-dienoyl-CoA reductase）；極長鏈先在 peroxisome 縮短（Zellweger、X-ALD）。
