notes_zh: '扭曲雙螺旋的大型損傷（UV 嘧啶雙體、6-4 光產物、苯并芘加成物、cisplatin 交聯）。E. coli：UvrA₂B 偵測 → UvrC 雙切（5′ 端 8 nt、3′ 端 4–5 nt）→ UvrD 移走 12–13-mer → Pol I、ligase。真核：GG-NER（XPC）與 TC-NER（停住的 Pol II + CSA/CSB）；TFIIH（XPB、XPD
  解旋）打開，XPG 與 XPF–ERCC1 切除 24–32 nt。XP（xeroderma pigmentosum）：日光敏感、皮膚癌；Cockayne syndrome：TC-NER 缺陷。TFIIH 同時參與轉錄（CTD kinase 只用於轉錄）。

  【補充】Eukaryotes: XPC (global genome) or stalled RNA Pol II + CSA/CSB (transcription-coupled) recognise the lesion; TFIIH helicases XPB/XPD open it; XPG (3'') and XPF–ERCC1 (5'') cut out 24–32 nt; Pol δ/ε
  fill. Defects: xeroderma pigmentosum (UV-sensitive skin cancer), Cockayne syndrome.'
