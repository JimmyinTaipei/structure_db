notes_zh: 'Watson–Crick B-DNA：右手、反平行雙股；糖–磷酸骨架在外、鹼基在內堆疊（stacking 是主要穩定力，H-bond 給專一性）。每圈 3.4 nm、10.5 bp，直徑 2 nm；大溝與小溝交替，序列專一的 DNA 結合蛋白（HTH、zinc finger、leucine zipper）多讀大溝。Chargaff：A = T、G = C（雙股）；GC 越多 T_m
  越高。A-DNA 較寬短（11 bp/turn，RNA–DNA hybrid、dsRNA）；Z-DNA 左手鋸齒（12 bp/turn，嘌呤嘧啶交替、甲基化 CpG）。

  【補充】B-DNA: right-handed, antiparallel; bases stacked 0.34 nm apart, perpendicular to the axis; A–T 2 H-bonds, G≡C 3 H-bonds; proteins read the sequence mainly in the major groove. A-DNA: right-handed,
  wider, 11 bp/turn (dehydrated; RNA–DNA hybrids, dsRNA). Z-DNA: left-handed zigzag, 12 bp/turn (alternating GC, methylated).'
