id: hill_plot
title: Hill plot
layout: plot
plot:
  size:
  - 15
  - 10
  params:
    P50m: 2.8
    P50: 26
    KR: 1.5
    KT: 250
    L: 85000.0
  x:
    min: -1
    max: 3
    label: log pO_2
    ticks:
    - -1
    - 0
    - 1
    - 2
    - 3
    at: -4
  y:
    min: -4
    max: 4
    label: log [Y/(1−Y)]
    ticks:
    - -4
    - -2
    - 0
    - 2
    - 4
    at: -1
  hlines:
  - y: 0
    label: Y = 0.5
  curves:
  - id: mb
    y: x - log10(P50m)
    color: cyan
  - id: hb
    y: logit(mwc(10**x, KR, KT, L))
    color: red
  - id: r
    y: x - log10(KR)
    color: gray
    dash: true
    from: 1.6
    to: 3
  - id: t
    y: x - log10(KT)
    color: gray
    dash: true
    from: -1
    to: 1.9
  points:
  - 'on': mb
    x: log10(P50m)
    y: 0
    color: cyan
  - 'on': hb
    x: log10(P50)
    y: 0
    color: red
    tol: 0.2
  legend:
    at:
    - 1.3
    - -1.75
    items:
    - curve: mb
      text: 'Mb: slope n_H = 1'
    - curve: hb
      text: 'Hb: slope n_H ≈ 3 at Y = 0.5'
    - curve: r
      text: slope 1 asymptotes (all-T / all-R)
  texts:
  - at:
    - 2.3
    - 2.75
    text: R state
    size: 0.9
    color: gray
  - at:
    - 0.0
    - -2.9
    text: T state
    size: 0.9
    color: gray
tags:
- protein
- hemoglobin
- enzyme
- allostery
notes_zh: Hill plot：log[Y/(1−Y)] 對 log pO₂。斜率 = Hill 係數 n_H。Mb 為斜率 1 的直線（無協同性）；Hb 在 Y = 0.5 附近斜率約 3（n_H ≈ 2.8–3，正協同），兩端回到斜率 1（全 T 態／全 R 態）。n_H > 1 正協同、< 1 負協同；n_H 不等於結合位數目（Hb 有 4 個）。Hb 曲線以 MWC 模型計算。
status: pending
