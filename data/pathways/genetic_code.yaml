notes_zh: '三聯體、不重疊、無標點、5′→3′、簡併（61 個有義密碼子對 20 種胺基酸）、近乎通用（粒線體 UGA = Trp、AUA = Met、AGA/AGG = stop）。AUG = 起始兼 Met；UAA、UAG、UGA = 終止。單一密碼子：Met、Trp；六個：Leu、Ser、Arg。Selenocysteine 用 UGA（+ SECIS）、pyrrolysine 用 UAG。

  【補充】Triplet, non-overlapping, comma-free, read 5′→3′; degenerate (61 sense codons for 20 aa); nearly universal (mitochondria: UGA = Trp, AUA = Met, AGA/AGG = stop in vertebrates). Single-codon aa: Met
  (AUG), Trp (UGG); six-codon aa: Leu, Ser, Arg. 21st aa selenocysteine (UGA + SECIS), 22nd pyrrolysine (UAG). Stop codons are read by release factors, not tRNAs. Codon usage is biased; in E. coli UAA >
  UGA > UAG.'
