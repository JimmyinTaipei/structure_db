id: two_component_system
title: Two-component system (bacteria, plants)
layout: linear
nodes:
- id: sig
  text: Signal
  kind: name
- id: sk
  text: 'Sensor kinase

    His → His-P

    (autophosphorylation)'
  kind: protein
- id: rr
  text: 'Response regulator

    Asp → Asp-P'
  kind: protein
- id: out
  text: 'Transcription /

    flagellar motor'
  kind: name
edges:
- from: sig
  to: sk
- from: sk
  to: rr
  label: phosphorelay
- from: rr
  to: out
tags:
- signal_transduction
notes_zh: 細菌與植物的二元系統：感應器 His kinase 自我磷酸化（His-P，phosphoramidate），再把磷酸轉給 response regulator 的 Asp（acyl-phosphate）→ 調控轉錄或鞭毛運動（趨化）。動物主要用 Ser/Thr、Tyr kinase。
