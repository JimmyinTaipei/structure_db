notes_zh: 升糖素（cAMP/PKA 磷酸化）：肝 glycogen phosphorylase、FBPase-2（F2,6BP ↓ → 糖解 ↓、糖質新生 ↑）、PEPCK（轉錄）↑；pyruvate kinase L、ACC、glycogen synthase ↓。脂肪 HSL 由 epinephrine／低胰島素活化。肝不能用酮體（缺 SCOT）。長期飢餓：腦改用酮體 → 減少蛋白質分解（保留肌肉）；RBC
  只能用葡萄糖。
