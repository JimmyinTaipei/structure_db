notes_zh: "A、G 兩支都匯流到 xanthine → uric acid（xanthine oxidase）。救援：HGPRT（hypoxanthine → IMP、guanine → GMP；缺乏 = Lesch-Nyhan）、APRT（adenine → AMP）。ADA 缺乏 → SCID；PNP 缺乏 → T 細胞缺陷。"
