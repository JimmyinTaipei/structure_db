notes_zh: PDH 複合體三個酵素、五個輔因子（TPP、lipoamide、CoA、FAD、NAD⁺；對應 B1、B5 以外的硫辛酸、B5、B2、B3）。① E1（pyruvate dehydrogenase，TPP）脫羧放出 CO₂，形成 hydroxyethyl-TPP；② 羥乙基被氧化並轉到 E2 lipoyl-Lys 的硫上（acetyl-dihydrolipoamide）；③ E2（dihydrolipoyl
  transacetylase）把乙醯基轉給 CoA → acetyl-CoA；④ E3（dihydrolipoyl dehydrogenase，FAD）把還原態 lipoamide 再氧化；⑤ FADH₂ 把電子交給 NAD⁺ → NADH。Lipoyl-Lys 長臂在三個活性位之間擺動（substrate channeling）。α-KG dehydrogenase、branched-chain
  α-keto acid dehydrogenase 同樣結構（E3 共用）。調控：PDK 磷酸化 E1 → 失活（ATP、NADH、acetyl-CoA 活化 PDK；pyruvate、ADP 抑制 PDK）；PDP 去磷酸 → 活化（Ca²⁺、insulin）。砷（arsenite）結合 lipoamide；thiamine 缺乏（Wernicke、酒精）→ 乳酸堆積。
