notes_zh: Edman 降解：PITC（phenyl isothiocyanate）在弱鹼下接上 N 端胺基，酸處理把 N 端殘基以 PTH-胺基酸切下，其餘胜肽保留 → 每次少一個，可重複約 50 次。Sanger 試劑 FDNB 標 N 端但會水解整條鏈（只能測一次）。不同切法產生重疊片段以排序；雙硫鍵位置：不先還原、切開後以 diagonal electrophoresis 比對。
