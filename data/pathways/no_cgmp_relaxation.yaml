notes_zh: 內皮細胞：ACh → M₃（Gq）→ PLC-β → IP₃ → ER 釋出 Ca²⁺ → Ca²⁺–calmodulin 活化 eNOS（Arg + O₂ + NADPH → citrulline + NO）。NO 為氣體，擴散進平滑肌，結合可溶型 guanylyl cyclase 的 heme → cGMP ↑ → PKG → 細胞內 Ca²⁺ 下降、myosin light
  chain 去磷酸 → 放鬆、血管擴張。PDE5 把 cGMP → GMP 終止訊號；sildenafil 抑制 PDE5。Nitroglycerin、nitroprusside 為 NO donor。氣體傳訊分子（gasotransmitters）：NO（NOS）、CO（heme oxygenase）、H₂S（cystathionine γ-lyase）。
