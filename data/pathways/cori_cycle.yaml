notes_zh: 肌肉（劇烈運動）與紅血球產生的乳酸送到肝臟做回葡萄糖：肝臟淨付出 4 ATP（6 − 2），代價由肝的脂肪酸氧化支付。類似的 glucose–alanine cycle 則同時把肌肉的胺基送去肝臟做尿素。
