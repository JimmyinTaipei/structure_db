notes_zh: Type II 限制酶：辨識 4–8 bp 回文、只需 Mg²⁺、不需 ATP、切割與甲基化分開 → 實驗用。命名：EcoRI = E. coli、R 株、第一個。細菌的 restriction–modification：自己的位點被 methylase 甲基化保護，外來（噬菌體）DNA 被切。EcoRI（G↓AATTC）產生 5′ 突出的黏端；SmaI 產生鈍端。4ⁿ：EcoRI
  平均每 4⁶ ≈ 4 kb 切一次。Isoschizomer（同位點同切點）、neoschizomer（同位點不同切點）。同一酶切載體與插入片段 → DNA ligase 接合 → 轉形。
