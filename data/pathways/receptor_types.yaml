notes_zh: 第一傳訊者分兩類：親水性（peptide、catecholamine）→ 膜受體 → 第二傳訊者，半衰期短；親脂性（steroid、thyroxine、vit. D、retinoic acid）→ 細胞內受體 → 調控轉錄，作用慢而久。膜受體：GPCR、RTK、受體 Ser/Thr kinase（TGF-β）、受體 guanylyl cyclase（ANF）、配體門控離子通道（nAChR）、本身無酵素活性的受體（經
  JAK）；另有 adhesion receptor（integrin、cadherin、selectin、Ig-CAM）。Steroid 受體平時與 Hsp90 結合在細胞質，結合激素後入核成 homodimer；vit. D、thyroid、RA 受體已在核內，與 RXR 形成 heterodimer。訊號系統特徵：specificity、sensitivity、amplification、modularity、desensitization、integration、divergence、localized
  response。
status: pending
