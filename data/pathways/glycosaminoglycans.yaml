notes_zh: GAG：由「胺基糖（GlcNAc／GalNAc／GlcN）＋ uronic acid（GlcA／IdoA）」的雙醣重複組成，多數帶硫酸 → 高負電、高度水合、潤滑抗壓。例外：hyaluronate 無硫酸、不接蛋白；keratan sulfate 以 galactose 代替 uronic acid。除 hyaluronate 外，GAG 以 Ser–Xyl–Gal–Gal–GlcA
  連接區共價接在 core protein 上 → proteoglycan。
