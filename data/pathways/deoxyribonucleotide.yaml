notes_zh: "RNR 作用於 NDP（二磷酸）層級，dATP 抑制全部、ATP 活化；dTMP 由 dUMP 甲基化（CH₂-THF 給碳＋電子 → DHF），DHF 必須經 DHFR 再生成 THF。藥物：hydroxyurea ⊣ RNR；5-FU ⊣ TS；methotrexate ⊣ DHFR。"
