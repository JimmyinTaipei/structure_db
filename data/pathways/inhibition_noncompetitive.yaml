id: inhibition_noncompetitive
title: Noncompetitive inhibition (pure)
layout: plot
panels:
- title: Michaelis–Menten
  size:
  - 12
  - 8.5
  params: &id001
    Vmax: 1
    Km: 2
    KmI: Km
    VmI: Vmax/2.2
  x:
    min: 0
    max: 20
    label: '[S]'
    marks:
    - at: Km
      label: K_m (unchanged)
      dx: 1.2
  y:
    min: 0
    max: 1.2
    label: v_0
    marks:
    - at: Vmax
      label: V_{max}
    - at: VmI
      label: V_{max}^{app}
      color: red
  hlines:
  - y: Vmax
    to: 11
  - y: VmI
    color: red
    to: 11
  curves:
  - id: 'no'
    y: mm(x, Vmax, Km)
    label: No inhibitor
    label_at: 16
    label_off:
    - -1.0
    - -0.7
  - id: inh
    y: mm(x, VmI, KmI)
    color: red
    label: + Inhibitor
    label_at: 16
    label_off:
    - -1.0
    - -0.65
  points:
  - 'on': 'no'
    x: Km
    y: Vmax/2
    drop: x
    dot: true
  - 'on': inh
    x: KmI
    y: VmI/2
    drop: x
    dot: true
    color: red
- title: Lineweaver–Burk
  size:
  - 12
  - 8.5
  params: *id001
  x:
    min: -0.8
    max: 1.4
    label: 1/[S]
    marks:
    - at: -1/Km
      label: −1/K_m (same)
      dx: -1.8
      dy: 0.6
  y:
    min: -0.6
    max: 6
    label: 1/v_0
    marks:
    - at: 1/Vmax
      label: 1/V_{max}
      right: true
      dx: 0.2
      dy: 0.6
    - at: 1/VmI
      label: 1/V_{max}^{app}
      color: red
      dy: -0.35
  curves:
  - id: 'no'
    y: Km/Vmax*x + 1/Vmax
    from: -1/Km*1.3
    to: 1.4
    label: No inhibitor
    label_at: 1.15
    label_off:
    - 0.3
    - 0.8
  - id: inh
    y: KmI/VmI*x + 1/VmI
    from: -1/KmI*1.3
    to: 1.4
    color: red
    label: + Inhibitor
    label_at: 0.5
    label_off:
    - 0.5
    - 0.4
    label_align: left
  points:
  - 'on': 'no'
    x: -1/Km
    y: 0
    dot: true
  - 'on': 'no'
    x: 0
    y: 1/Vmax
    dot: true
  - 'on': inh
    x: -1/KmI
    y: 0
    dot: true
    color: red
  - 'on': inh
    x: 0
    y: 1/VmI
    dot: true
    color: red
caption:
  text: 'Noncompetitive inhibition (pure):  K_m unchanged   V_{max} ↓'
  color: red
tags:
- enzyme
- enzyme_kinetics
- inhibition
notes_zh: （純）非競爭性抑制：抑制劑結合在別處，對 E 與 ES 親和力相同（α = α'）。V_{max}^app = V_{max}/α 變小、K_m 不變；加受質無法克服。雙倒數圖：直線交於 x 軸（−1/K_m 相同），y 截距變大。例：重金屬、許多別位抑制劑。考題的 noncompetitive 通常指這種。
status: pending
