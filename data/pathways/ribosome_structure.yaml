notes_zh: '70S = 30S（16S + 21 蛋白）+ 50S（23S + 5S + 33 種蛋白，L7/L12 有 4 份共 36 個）；80S = 40S（18S）+ 60S（28S、5.8S、5S）。A = aminoacyl-tRNA、P = peptidyl-tRNA、E = exit。小次單元先結合 mRNA 並負責解碼；大次單元的 23S/28S rRNA 形成 peptidyl
  transferase center（ribozyme）。證明：puromycin 只與 P 位的 peptidyl-tRNA 反應；一個核糖體可結合 3 個去醯化 tRNA 但只能 2 個胺醯 tRNA → E 位。

  【補充】How the sites were found: puromycin (looks like Tyr-tRNA) reacts only with peptidyl-tRNA in the P site, not in the A site; three deacylated tRNAs fit on one ribosome but only two aminoacyl-tRNAs →
  a third (E) site. Ribosome ~2.5 MDa (bacteria), two-thirds rRNA. Polysome: many ribosomes on one mRNA.

  【補充】large subunit: peptidyl transferase centre (23S / 28S rRNA = ribozyme), exit tunnel small subunit: binds mRNA first, decoding centre (16S / 18S rRNA)'
