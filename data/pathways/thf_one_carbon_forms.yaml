notes_zh: 洋紅為一碳單位，由上到下氧化程度遞減：formyl／methenyl（甲酸層級）→ methylene（甲醛層級）→ methyl（甲醇層級）。N¹⁰-formyl-THF：嘌呤 C2、C8，fMet-tRNA；N⁵,N¹⁰-methylene-THF：Ser → Gly（SHMT）產生，供 thymidylate synthase （dUMP → dTMP，同時給出還原力，THF
  → DHF，需 DHFR 再生；methotrexate、5-FU 作用點）；N⁵-methyl-THF：MTHFR 不可逆生成，唯一去路為 methionine synthase（B12）把甲基給 homocysteine。B12 缺乏 → methyl-folate trap。
