id: inhibition_uncompetitive
title: Uncompetitive inhibition
layout: plot
panels:
- title: Michaelis–Menten
  size:
  - 12
  - 8.5
  params: &id001
    Vmax: 1
    Km: 2
    KmI: Km/3
    VmI: Vmax/3
  x:
    min: 0
    max: 20
    label: '[S]'
    marks:
    - at: KmI
      label: K_m^{app}
      color: red
      dx: -0.6
    - at: Km
      label: K_m
      dx: 0.5
  y:
    min: 0
    max: 1.2
    label: v_0
    marks:
    - at: Vmax
      label: V_{max}
    - at: VmI
      label: V_{max}^{app}
      color: red
  hlines:
  - y: Vmax
    to: 11
  - y: VmI
    color: red
    to: 11
  curves:
  - id: 'no'
    y: mm(x, Vmax, Km)
    label: No inhibitor
    label_at: 16
    label_off:
    - -1.0
    - -0.7
  - id: inh
    y: mm(x, VmI, KmI)
    color: red
    label: + Inhibitor
    label_at: 16
    label_off:
    - -1.0
    - -0.65
  points:
  - 'on': 'no'
    x: Km
    y: Vmax/2
    drop: x
    dot: true
  - 'on': inh
    x: KmI
    y: VmI/2
    drop: x
    dot: true
    color: red
- title: Lineweaver–Burk
  size:
  - 12
  - 8.5
  params: *id001
  x:
    min: -1.9
    max: 1.4
    label: 1/[S]
    marks:
    - at: -1/Km
      label: −1/K_m
      dx: 0.9
    - at: -1/KmI
      label: −1/K_m^{app}
      color: red
      dy: 0.9
  y:
    min: -0.6
    max: 4
    label: 1/v_0
    marks:
    - at: 1/Vmax
      label: 1/V_{max}
      right: true
      dx: 0.2
      dy: 0.6
    - at: 1/VmI
      label: 1/V_{max}^{app}
      color: red
      dy: -0.45
  curves:
  - id: 'no'
    y: Km/Vmax*x + 1/Vmax
    from: -1/Km*1.3
    to: 1.4
    label: No inhibitor
    label_at: 1.15
    label_off:
    - 0.3
    - 0.8
  - id: inh
    y: KmI/VmI*x + 1/VmI
    from: -1/KmI*1.3
    to: 1.4
    color: red
    label: + Inhibitor
    label_at: -0.45
    label_off:
    - -0.4
    - -0.8
    label_align: right
  points:
  - 'on': 'no'
    x: -1/Km
    y: 0
    dot: true
  - 'on': 'no'
    x: 0
    y: 1/Vmax
    dot: true
  - 'on': inh
    x: -1/KmI
    y: 0
    dot: true
    color: red
  - 'on': inh
    x: 0
    y: 1/VmI
    dot: true
    color: red
caption:
  text: 'Uncompetitive inhibition:  K_m ↓   V_{max} ↓ (same factor) → parallel lines'
  color: red
tags:
- enzyme
- enzyme_kinetics
- inhibition
notes_zh: 反競爭性抑制：抑制劑只結合 ES 複合物。V_{max} 與 K_m 以同樣倍數下降（V_{max}/K_m 比值不變）→ 雙倒數圖為平行線（斜率 K_m/V_{max} 相同）。例：lithium 抑制 inositol monophosphatase（口訣：parallel）。
status: pending
