notes_zh: E. coli 複製叉：helicase（DnaB，六聚體，ATP）在 5′→3′ 方向沿延遲股模板解開雙股；SSB 保護單股；gyrase（topo II）在前方解除正超螺旋。Primase（DnaG）合成 RNA 引子 → Pol III（β clamp 增加持續性）延伸。領先股連續合成；延遲股以 Okazaki 片段（原核 1000–2000 nt，真核 100–200 nt）不連續合成。Pol
  I 以 5′→3′ exonuclease 移除引子並補上 DNA（nick translation），DNA ligase（E. coli 用 NAD⁺，真核用 ATP）封閉切口。新股一律 5′→3′ 延伸（3′-OH 攻擊 dNTP 的 α-P）；模板 3′→5′ 讀取。
