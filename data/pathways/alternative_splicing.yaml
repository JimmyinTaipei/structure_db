notes_zh: 'Constitutive：所有 exon 都保留。Alternative：exon skipping、互斥 exon、替代 5′/3′ 剪接位、intron retention；calcitonin 基因在甲狀腺 C 細胞產生 calcitonin，在神經產生 CGRP（替代 poly(A) 位 + 剪接）。Trans-splicing：兩條不同 RNA 接合（錐蟲 SL RNA），intron
  為 Y 形。SR protein 促進、hnRNP 抑制。

  【補充】~95 % of human multi-exon genes are alternatively spliced: exon skipping, mutually exclusive exons, alternative 5′ / 3′ sites, intron retention. Chosen by SR proteins (bind exonic splicing enhancers)
  vs hnRNPs (silencers). Drosophila Dscam: > 38 000 possible isoforms. Sex lethal / transformer: sex determination.'
