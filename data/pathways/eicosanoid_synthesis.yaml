notes_zh: cPLA₂ 從膜磷脂 sn-2 釋出 arachidonate（20:4 ω-6）。COX 路徑 → prostanoid（PG、TX）；LOX 路徑 → leukotriene、lipoxin。PGI₂（內皮）與 TXA₂（血小板）作用相反。aspirin 不可逆乙醯化 COX；低劑量時只有無核的血小板無法再生 COX-1 → 選擇性 TXA₂ ↓。aspirin-exacerbated
  respiratory disease：COX 被抑制 → 更多 arachidonate 走 LOX → cysteinyl LT ↑。
