notes_zh: Trp → serotonin → melatonin；Trp → kynurenine → NAD⁺（60 mg Trp ≈ 1 mg niacin，需 B6、B2）。Hartnup（中性胺基酸吸收障礙）與 carcinoid（Trp 被大量拿去做 serotonin）→ pellagra。
