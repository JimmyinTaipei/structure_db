notes_zh: 飢餓、糖尿病（insulin ↓、glucagon ↑）時，β 氧化產生的 acetyl-CoA 超過 TCA 的處理量（OAA 被拿去做糖質新生）→ 酮體。肝製造、肝外利用（SCOT：succinyl-CoA → succinate；肝缺 SCOT）。腦在長期飢餓時可用酮體提供約 2/3 能量；紅血球不能用（無粒線體）。
