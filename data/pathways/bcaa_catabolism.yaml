notes_zh: 主要在肌肉轉胺（BCAT），α-酮酸由 BCKDH（輔因子同 PDH：TPP、lipoate、CoA、FAD、NAD⁺）氧化脫羧。缺乏 → 楓糖尿症（MSUD）：尿有楓糖漿味、餵食困難、神經退化；治療：限制 BCAA、部分對 thiamine 有反應。Leu 只生酮、Val 只生糖、Ile 兩者皆是。
