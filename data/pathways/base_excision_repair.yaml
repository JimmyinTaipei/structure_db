notes_zh: '單一受損鹼基（不扭曲雙螺旋）：DNA glycosylase 切斷 N-醣苷鍵 → AP（無嘌呤／無嘧啶）位 → APE1 在 5′ 端切開 → Pol β 補 1 nt 並移除 dRP → ligase III–XRCC1。Glycosylase 例：UNG（uracil，來自 C 去胺）、OGG1（8-oxoG）、TDG（T·G，來自 5mC 去胺）、AAG（烷化）。自發去嘌呤每細胞每天約上萬次。DNA
  用 T 而不用 U：C 去胺成 U 才能被辨認為錯誤。

  【補充】Small, non-distorting lesions: deaminated bases (U from C, hypoxanthine from A), 8-oxoG (OGG1), alkylated bases, AP sites (depurination). 5-methyl-C → T gives a T·G mismatch: removed by TDG (thymine-DNA
  glycosylase) — CpG sites are mutation hot spots.'
