notes_zh: 依性質選方法：電荷（離子交換、等電聚焦、等電點沉澱）、大小（膠體過濾大分子先出、透析、SDS-PAGE 依質量、超高速離心）、溶解度（硫酸銨鹽析）、親和力（配體、抗體、His-tag–Ni²⁺、GST–glutathione）、疏水性（HIC、RP-HPLC）。純化表：總蛋白質下降、比活性（units/mg）上升，回收率下降。
