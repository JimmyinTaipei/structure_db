notes_zh: 'RNA triphosphatase 去 γ-P → guanylyltransferase 由 GTP 加上 GMP（5′–5′ 三磷酸鍵，放出 PPi）→ guanine-N7-methyltransferase（SAM）→ cap 0；2′-O-methyltransferase 甲基化第 1（cap 1）、第 2（cap 2）個核苷酸的核糖 2′-OH。酵素結合在 Ser5
  磷酸化的 CTD，RNA 約 25 nt 時加上。

  【補充】Added co-transcriptionally (RNA ~25 nt) by enzymes bound to the Ser5-phosphorylated CTD of Pol II; only Pol II transcripts are capped. Functions: blocks 5′→3′ exonucleases, nuclear export (cap-binding
  complex CBC), translation initiation (eIF4E binds the cap), splicing of the first intron. Decapping (Dcp1/Dcp2) → Xrn1 degrades the mRNA 5′→3′. teal = from GTP.'
