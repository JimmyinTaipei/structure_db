notes_zh: 鹼基替換：transition（同類嘌呤或嘧啶互換）、transversion（嘌呤↔嘧啶）。對蛋白質的影響：silent、missense、nonsense；插入／缺失非 3 的倍數 → frameshift。三核苷酸重複擴增（滑動）：Huntington（CAG，多麩醯胺）、fragile X（CGG，FMR1 甲基化沉默）、myotonic dystrophy（CTG），具
  anticipation。
