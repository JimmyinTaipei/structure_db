notes_zh: Euchromatin（開）：H3/H4 Lys 乙醯化（HAT，中和正電、鬆開），CpG island 低甲基化。Heterochromatin（關）：去乙醯化（HDAC）、H3K9me3 / H3K27me3（HMT；HP1、Polycomb）、CpG 5mC（DNMT；MeCP2 結合）。H3K4me3 則與活化相關。Imprinting：親源特異的甲基化使單一 allele
  表現（IGF2 父源、H19 母源）。IGF2/H19：父源 ICR（insulator）被甲基化 → CTCF 無法結合 → 下游 enhancer 可活化 IGF2；母源 ICR 未甲基化 → CTCF 結合隔絕 → IGF2 關、H19 開（甲基化在此反而促成表現；Alberts 7e p.438）。15q11–13 缺失：父源 → Prader–Willi；母源（UBE3A）→ Angelman。X
  不活化（Xist）也屬表觀遺傳。
