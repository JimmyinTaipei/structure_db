id: dna_melting_curve
title: DNA melting curve
layout: plot
plot:
  size:
  - 15
  - 9.5
  params:
    Tm1: 70
    Tm2: 82
  x:
    min: 40
    max: 100
    label: Temperature (°C)
    ticks:
    - 40
    - 60
    - 80
    - 100
    at: 0.7
    marks:
    - at: Tm1
      label: T_m
      color: cyan
    - at: Tm2
      label: T_m
      color: magenta
  y:
    min: 0.7
    max: 1.5
    label: A_{260}
    ticks: []
    at: 40
  curves:
  - id: at
    y: 1 + 0.37/(1+exp(-(x-Tm1)/1.4))
    width: 1.1
    color: cyan
  - id: gc
    y: 1 + 0.37/(1+exp(-(x-Tm2)/1.4))
    width: 1.1
    color: magenta
  - id: ss
    y: 1.0 + 0.0042*(x-40)
    color: orange
    dash: true
  points:
  - 'on': at
    x: Tm1
    y: 1.185
    color: cyan
    drop: x
  - 'on': gc
    x: Tm2
    y: 1.185
    color: magenta
    drop: x
  legend:
    at:
    - 62
    - 0.93
    items:
    - curve: at
      text: AT-rich dsDNA (T_m lower)
    - curve: gc
      text: GC-rich dsDNA (T_m higher; G≡C)
    - curve: ss
      text: 'ssRNA: gradual, non-cooperative'
  texts:
  - at:
    - 92
    - 1.44
    text: 'single strands

      (hyperchromic)'
    size: 0.85
    color: gray
  - at:
    - 41
    - 1.3
    text: 'double helix

      (stacked bases

      absorb less)'
    size: 0.85
    color: gray
    align: left
tags:
- nucleotide
notes_zh: 加熱 dsDNA → 協同性解旋（S 形），A₂₆₀ 上升約 40 %（hyperchromic effect：疊在一起的鹼基吸光較少）。T_m = 一半解開的溫度。T_m 上升：G+C 含量高（3 個氫鍵、堆疊較強）、鹽濃度高（遮蔽磷酸負電）；T_m 下降：低鹽、極端 pH、formamide/urea。ssRNA 只有局部配對 → 曲線平緩、無協同性。冷卻復性（renaturation）→
  hypochromic。
status: pending
