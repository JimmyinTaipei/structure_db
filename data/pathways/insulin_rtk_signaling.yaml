notes_zh: Insulin receptor 為 α₂β₂ 四聚體（已是二聚體）；生長因子受體（EGFR、PDGFR）要配體誘導二聚化才能 trans-autophosphorylation。MAPK 路徑：IRS-1-P —SH2-Grb2-SH3— Pro-Sos → Ras（GEF 換 GTP）→ Raf-1 → MEK（磷酸化 ERK 的 Thr 與 Tyr，雙特異性 kinase）→
  ERK 入核 → Elk-1。IRS-1、Grb2、Sos 本身沒有酵素活性（adaptor）。PI3K–Akt：PIP₃ 招募 PDK1 與 Akt 到膜 → PDK1 磷酸化 Akt → GLUT4、肝醣合成（抑制 GSK3）。PTEN 去 PIP₃ 的 3-磷酸。PLC-γ（由 RTK 活化；GPCR 活化的是 PLC-β）。Ras 突變（GTPase 失效）常見於癌症。
