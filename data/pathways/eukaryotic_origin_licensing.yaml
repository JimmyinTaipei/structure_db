notes_zh: G1（CDK 低）：ORC 結合起點 → Cdc6、Cdt1 把 MCM2–7 以雙六聚體套在雙股 DNA 上（licensed，但不活化）。S 期：CDK 與 DDK（Cdc7–Dbf4）磷酸化 → Cdc45 + GINS 加入成 CMG helicase，兩組朝相反方向移動 → 雙向複製。S/G2 時 CDK 高、geminin 抑制 Cdt1 → 不能再裝 MCM → 每個起點每週期只發一次（防止重複複製）。真核聚合酶：α（含
  primase，起始 RNA–DNA 引子）、ε（領先股）、δ（延遲股）、γ（粒線體）、β（BER 修補）；PCNA = clamp，RFC = clamp loader；引子移除：Pol δ 股置換把引子推成 flap → FEN1 切除（長 flap 加 Dna2）；RNase H1 可降解 RNA 但切不掉最後一個與 DNA 相連的 rN。
