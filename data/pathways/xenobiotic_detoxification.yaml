notes_zh: Phase I（官能基化）：主要是 cytochrome P450 單氧酶（mixed-function oxidase，肝 smooth ER）：O₂ 的一個 O 進入受質成 –OH、另一個成 H₂O，電子由 NADPH 經 cytochrome P450 reductase（FAD、FMN）供應。Phase II（結合）：UDP-glucuronosyltransferase（UGT，UDP-glucuronate）、sulfotransferase（PAPS）、GST（glutathione）、N-acetyltransferase、methyltransferase
  → 水溶性增加 → 尿或膽汁排出。同類單氧酶：類固醇合成的 P450（CYP11A1、21、11B1、17）、7α-hydroxylase（膽酸）、desaturase（配 cyt b₅）、NOS。CYP 誘導：酒精（CYP2E1）、phenobarbital、rifampin；抑制：葡萄柚汁、ketoconazole。新生兒 UGT 不足 → 生理性黃疸；Crigler–Najjar、Gilbert
  為 UGT1A1 缺陷。
