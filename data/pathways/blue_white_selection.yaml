notes_zh: 質體帶 amp^R（只讓轉形菌生長）與 lacZα（MCS 位於其中）。宿主 lacZΔM15 + 質體 lacZα → α-complementation 形成 β-gal → X-gal 變藍；插入片段破壞 lacZα → 白色菌落 = 含重組質體。需 IPTG 誘導。pBR322：amp^R 與 tet^R，插入 tet^R → 可長在 ampicillin、不能長在 tetracycline（replica
  plating 挑出）。
