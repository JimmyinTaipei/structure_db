notes_zh: mRNA 的 poly(A) 以 oligo(dT) 為引子 → reverse transcriptase 合成第一股（RNA–DNA hybrid）→ RNase H 切 RNA 留下小段當引子 → DNA Pol I 合成第二股、ligase 接合。（另法：鹼／S1 nuclease 去除髮夾。）cDNA 沒有 intron，可在細菌表現真核蛋白；cDNA library 代表某組織當下表現的基因，genomic
  library 代表全基因體。
