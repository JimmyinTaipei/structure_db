notes_zh: 水解 ΔG°′ 比 ATP 更負的化合物（PEP −14.8、1,3-BPG −11.8、phosphocreatine −10.3 kcal/mol）可把 Ⓟ 交給 ADP（受質層次磷酸化：PK、PGK、creatine kinase）；ATP（−7.3）再把 Ⓟ 交給 glucose 等形成低能磷酸酯（G6P −3.3）。ATP 位居中間 → 能量的「通貨」。PEP 特別高：水解後
  enol → keto 互變（tautomerization）額外釋能。1,3-BPG：acyl-phosphate（混合酸酐）。ATP 高能的原因：① 磷酸間負電排斥 ② 產物的共振穩定較大 ③ 產物離子化／溶劑化（ADP³⁻ + Pi²⁻ + H⁺）。
