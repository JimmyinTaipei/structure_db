notes_zh: 乙醛酸循環：2 acetyl-CoA → 1 succinate（淨合成 4 碳），跳過 TCA 的兩個脫羧步驟。洋紅箭頭為兩個獨特酵素：isocitrate lyase、malate synthase。植物種子把脂肪轉成糖靠它；動物沒有這兩個酵素 → 偶數碳脂肪酸（acetyl-CoA）無法淨合成葡萄糖（PDH 不可逆，且 TCA 中 2 個碳以 CO₂ 離開）。奇數碳脂肪酸的
  propionyl-CoA → succinyl-CoA 則可以。
