notes_zh: GPCR = 7 次跨膜（舊名 serpentine receptor），本身是 G 蛋白的 GEF：促使 Gα 釋出 GDP、結合 GTP。四類：Gs（β-adrenergic、glucagon；嗅覺 Golf）活化 AC → cAMP ↑；Gi（α₂、M₂、M₄；視覺 transducin Gt 與苦味 gustducin 經 PDE 使 cyclic nucleotide 下降）抑制
  AC；Gq/11（α₁、M₁/₃/₅、angiotensin II、vasopressin V₁）活化 PLC-β → IP₃ + DAG；G12/13 → RhoGEF → Rho（細胞骨架）。毒素：cholera toxin ADP-ribosylate Gsα 的 Arg → GTPase 失效 → cAMP 持續；pertussis toxin ADP-ribosylate Giα 的 Cys
  → 無法抑制 AC → cAMP 上升。
