notes_zh: 細胞質 NADH 把 DHAP 還原成 glycerol 3-phosphate；位在內膜外側的 mitochondrial G3P DH（FAD）把它氧化回 DHAP，電子直接給 Q，跳過 Complex I → 每個細胞質 NADH 只得約 1.5 ATP。骨骼肌（白肌）、腦、棕色脂肪常用；不可逆（單向）。所以葡萄糖完全氧化：malate–aspartate shuttle 32
  ATP，glycerol 3-P shuttle 30 ATP。
