notes_zh: '① EF-Tu·GTP·aa-tRNA 進 A 位，密碼子正確 → GTP 水解、EF-Tu·GDP 離開（EF-Ts 換 GTP）；② peptidyl transfer：A 位胺基攻擊 P 位酯鍵（23S rRNA）；③ EF-G·GTP 轉位：P→E、A→P、mRNA 前進 3 nt；④ E 位 tRNA 離開。每個胜肽鍵 2 GTP。真核 eEF1A、eEF1B、eEF2（白喉毒素
  ADP-ribosylation）。

  【補充】Each cycle: 2 GTP (EF-Tu, EF-G) per peptide bond, ~15–20 aa/s in E. coli. EF-Ts (eEF1B) exchanges GDP for GTP on EF-Tu (eEF1A). EF-G (eEF2) mimics the EF-Tu·tRNA shape. Peptidyl transfer needs no
  protein or energy: the ester bond of peptidyl-tRNA pays for it (23S rRNA A2451 positions the substrates). The growing chain is handed from the P-site tRNA onto the A-site aminoacyl-tRNA (head growth).
  Fidelity: kinetic proofreading after GTP hydrolysis (accommodation). Error ~1/10^4. Diphtheria toxin ADP-ribosylates eEF2 (diphthamide).'
