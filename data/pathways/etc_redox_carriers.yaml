notes_zh: E°′ 由負到正排列：NADH −0.32 → Q +0.05 → cyt c₁ +0.22 → cyt c +0.25 → cyt a +0.29 → a₃ +0.35 → O₂ +0.82 V（Lehninger Table 19-2 的近似值）。cytochrome 的順序 b → c₁ → c → a → a₃ 是常考點。Q 與 cyt c 是可移動載體；Fe-S 與 cytochrome
  一次只傳 1 個電子，FMN 與 Q 可以 1 或 2 個。
