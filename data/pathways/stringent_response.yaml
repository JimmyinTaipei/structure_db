notes_zh: 胺基酸缺乏 → 未帶胺基酸的 tRNA 進入 A 位 → 核糖體上的 RelA（stringent factor）以 GTP + ATP 合成 (p)ppGpp（alarmone）→ 結合 RNA pol，rRNA、tRNA 轉錄下降。核糖體蛋白的轉譯回饋：r-protein（如 L1）優先結合 rRNA；rRNA 不足時多出的 L1 結合自己 operon 的 mRNA（SD 附近）→
  抑制整個 operon（L11 operon = L11 + L1）的轉譯（translational repressor）；L10 operon（L10、L7/L12）則由 L10 自我調控。
