notes_zh: DNA 雙股斷裂 → MRN → ATM/ATR 磷酸化 p53（不再被 MDM2 送去分解）→ p53 轉錄 p21（CDK inhibitor）→ CDK2/cyclin E 失活 → Rb 保持去磷酸、抓住 E2F → 停在 G1 修復；無法修復則 p53 → Bax → 凋亡。p53、Rb、BRCA1/2 為腫瘤抑制基因（loss-of-function、隱性、常為生殖細胞遺傳）；Ras、Myc、ErbB2
  為原致癌基因（gain-of-function、顯性、體細胞突變）。原致癌基因活化方式：點突變、基因擴增、染色體轉位、promoter/enhancer 插入。c-onc 與 v-onc（病毒來源）。
