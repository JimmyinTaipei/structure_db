notes_zh: 'E1（ATP → AMP + PPi，Ub 與 Cys 形成硫酯）→ E2 → E3（受質專一性）→ K48 多聚泛素（≥ 4）→ 26S proteasome（19S 認 Ub、去泛素、ATP 解摺疊；20S 核心 β1、β2、β5 蛋白酶） → 7–9 aa 胜肽，Ub 回收。N-end rule、PEST 決定半衰期。K63 鏈為訊號用途。Bortezomib 抑制 β5。

  【補充】E1 activates Ub (thioester on Cys, via Ub-AMP); E2 carries it; E3 (hundreds: RING / HECT; e.g. MDM2 → p53, SCF / APC-C → cyclins, parkin, VHL → HIF-1α) gives specificity. N-end rule: half-life depends
  on the N-terminal residue (Met, Ser, Ala long; Arg, Lys, Phe, Leu short). PEST sequences shorten half-life. K63 chains → signalling (NF-κB), not degradation. Bortezomib inhibits β5 (multiple myeloma).
  Lysosomes (autophagy) degrade long-lived and membrane proteins; the proteasome degrades short-lived, misfolded (ERAD) proteins.'
