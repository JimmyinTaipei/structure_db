id: gtpase_switch
title: 'GTPase switch: GEF and GAP'
layout: cycle
radius: 1.7
cell_size: 5.0
start_angle: 180
center_text: 'GTPase

  switch'
nodes:
- id: 'off'
  text: 'GTPase–GDP

    (inactive)'
  kind: protein
- id: 'on'
  text: 'GTPase–GTP

    (active) → effectors'
  kind: protein
edges:
- from: 'off'
  to: 'on'
  label: 'GEF

    (GDP out, GTP in)'
  bend: 0.5
- from: 'on'
  to: 'off'
  label: 'GAP / RGS

    (GTP → GDP + P_i)'
  bend: 0.5
  color: red
tags:
- signal_transduction
- gpcr
notes_zh: GTPase 本身水解 GTP 很慢；GEF 促進 GDP 釋出（活化），GAP 加速 GTP 水解（關閉）。例：G 蛋白（GEF = GPCR；GAP = RGS）、Ras（GEF = Sos；GAP = RasGAP/NF1）、EF-Tu（GEF = EF-Ts）、Ran、Rho、Rab、Arf。Ras 致癌突變（G12V）使 GTPase 失效 → 持續 on；NF1 缺失
  → GAP 失去 → neurofibromatosis。脂質修飾：Gα（myristoyl、palmitoyl）、Gγ（farnesyl/geranylgeranyl）、Ras（farnesyl）把它們錨在膜內側。
status: pending
