notes_zh: 胰島素（去磷酸化）：肝 glucokinase、PFK-2、pyruvate kinase、PDH、ACC、glycogen synthase、HMG-CoA reductase 活性 ↑；肌肉與脂肪 GLUT4 上膜；脂肪 LPL ↑、HSL ↓。合成作用為主：肝醣、脂肪酸、TAG、蛋白質。腦與 RBC 不依賴胰島素攝取葡萄糖（GLUT1/3）。
