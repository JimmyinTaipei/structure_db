notes_zh: DNA 聚合需要引子末端的 3′-OH 攻擊下一個 dNTP。沒有 3′-OH 的類似物一旦接上就終止延長：ddNTP（Sanger 定序）、AZT（HIV 反轉錄酶）、acyclovir（皰疹，需病毒 TK 活化）、ganciclovir（CMV）。對照：cytarabine（ara-C，阿拉伯糖）、gemcitabine 屬於抗代謝物；5-FU、methotrexate 抑制
  dTMP 合成。
