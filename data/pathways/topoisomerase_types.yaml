notes_zh: 'Topo I：切斷一股（活性 Tyr 與磷酸形成共價中間物，能量保留所以不耗 ATP），另一股旋轉後接回 → 連結數 Lk 改變 1。真核 topo I 可鬆弛正、負超螺旋。Topo II：二聚體切斷雙股（G 段），讓另一段雙股（T 段）穿過再接回 → ΔLk = 2，耗 ATP。細菌 gyrase 是唯一能主動引入負超螺旋的 topo II；topo IV 分離連環體。藥物：camptothecin、irinotecan、topotecan（topo
  I）；etoposide、doxorubicin（topo II，抗癌）；quinolone（ciprofloxacin）抑制 gyrase 與 topo IV。

  【補充】Inhibitors: camptothecin, irinotecan, topotecan (topo I); etoposide, doxorubicin (topo II); quinolones / fluoroquinolones (bacterial gyrase, topo IV); novobiocin (gyrase ATPase).'
