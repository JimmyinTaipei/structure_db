notes_zh: CAH 三型比較（新生兒、皆 cortisol ↓ → ACTH ↑ → 腎上腺增生）：21-hydroxylase 缺乏（90%）：aldosterone ↓（失鹽、低血壓、高血鉀）、17-OHP ↑、雄性素 ↑（女嬰男性化）；11β-hydroxylase 缺乏：DOC ↑ → 高血壓、低血鉀＋雄性素 ↑；17α-hydroxylase 缺乏：性荷爾蒙與 cortisol ↓、DOC
  ↑ → 高血壓、低血鉀、性徵不發育。口訣：數字以 1 開頭（11β、17α）→ 高血壓；以 1 結尾（21、11）→ 男性化。
