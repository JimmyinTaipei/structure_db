notes_zh: 無氧時 NADH 無法經 ETC 氧化，GAPDH 需要的 NAD⁺ 必須在細胞質再生：乳酸發酵（LDH）或酒精發酵（PDC + ADH）。兩者都淨得 2 ATP／glucose，沒有淨氧化還原（GAPDH 產生的 NADH 在最後一步用掉）。Pasteur effect：有氧時葡萄糖消耗速率下降（每分子產 ~30–32 ATP，ATP、citrate 抑制 PFK-1）。人體沒有
  pyruvate decarboxylase；肝的 ADH 方向相反（ethanol → acetaldehyde）。
