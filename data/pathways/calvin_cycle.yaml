notes_zh: Calvin cycle（暗反應，stroma）：3 CO₂ + 9 ATP + 6 NADPH → 1 G3P。三階段：固定（Rubisco：3 RuBP → 6 3-PG）、還原（類似糖質新生的 PGK、GAPDH，但用 NADPH）、再生（與 PPP 非氧化相同的 transketolase／aldolase 重排：5 G3P → 3 Ru5P）。ATP 與 NADPH 來自光反應。
