notes_zh: Gq → PLC-β 切 PIP₂：DAG 留在膜上活化 PKC；IP₃ 開啟 ER 的 IP₃ receptor 釋出 Ca²⁺（也協同活化 PKC）。Insulin／RTK → PI3K 把 PIP₂ 的 3 位磷酸化成 PIP₃ → 招募 PDK1、Akt（PKB）→ Akt 被磷酸化活化。PTEN 把 PIP₃ 去磷酸回 PIP₂。
