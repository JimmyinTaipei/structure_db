notes_zh: 頭尾兩步在粒線體，中間在細胞質；骨髓（約 85%）與肝。紫質症：AIP（PBG deaminase；急性腹痛、神經精神、紅尿，無光敏感，藥物／酒精／飢餓誘發，治療 hemin + 葡萄糖）、PCT（UROD；最常見，光敏感水泡，與 HCV、酒精、鐵過多有關）、CEP（UROS）、EPP（ferrochelatase）。鉛：抑制 ALAD 與 ferrochelatase。
