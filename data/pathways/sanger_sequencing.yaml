notes_zh: Primer + DNA polymerase + 4 種 dNTP + 少量 ddNTP（缺 3′-OH）→ 隨機在各位置終止 → 一組長度差 1 nt 的片段。四管（ddA、ddC、ddG、ddT）各跑一道膠，由下（短）往上讀 = 新股 5′→3′；與模板互補。現代用四色螢光 ddNTP + 毛細管電泳。Maxam–Gilbert 為化學切割法；NGS（如 pyrosequencing：PPi
  → ATP sulfurylase → luciferase 發光）。
