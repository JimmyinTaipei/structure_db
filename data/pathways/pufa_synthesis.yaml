notes_zh: 人體去飽和酶只能在 C9 與羧基之間加雙鍵（Δ9、Δ6、Δ5、Δ4），沒有 Δ12、Δ15（綠色，只有植物）→ linoleate（ω6）與 α-linolenate（ω3）為必需脂肪酸。延長與去飽和保留 ω 位置：ω6 → arachidonate；ω3 → EPA → DHA（魚油）。ω 編號：從甲基端數第一個雙鍵；n−x 同義。
