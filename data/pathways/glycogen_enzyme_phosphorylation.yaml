notes_zh: 同一個訊號相反作用：glucagon（肝）／epinephrine（肝、肌）→ cAMP → PKA → phosphorylase kinase → 磷酸化 phosphorylase（b → a，活化）；PKA 與 GSK3 同時磷酸化 glycogen synthase（a → b，失活）→ 分解開、合成關。Insulin → PP1 去磷酸化兩者 → 合成開、分解關（insulin
  也經 Akt 抑制 GSK3）。別構：AMP 活化肌肉 phosphorylase b（運動時不需激素）；肝 phosphorylase a 被 glucose 抑制（血糖感測）；G6P 活化 synthase b。記法：磷酸化 → 分解酵素活化、合成酵素失活（ACC、PFK-2 亦同）。
