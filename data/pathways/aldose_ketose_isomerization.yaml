notes_zh: 互變異構（tautomerism）：aldose 的 C1 醛基與 C2–H 互換 → cis-enediol → ketose。鹼性下 glucose、mannose、fructose 互相轉換（Lobry de Bruyn–van Ekenstein）；酵素版即 phosphoglucose isomerase（G6P ⇌ F6P）、triose phosphate isomerase。Fructose
  在鹼性 Fehling 試劑中也呈還原性，就是因為能轉成 enediol／aldose。
