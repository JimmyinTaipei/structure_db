notes_zh: 'Holoenzyme（α₂ββ′ωσ）的 σ 認 −35（TTGACA）與 −10（TATAAT，Pribnow box）→ closed complex → 不需 helicase 自行解開 −10 至 +2（open complex） → abortive initiation（反覆合成 2–9 nt 短 RNA）→ RNA 超過約 10 nt 時 promoter escape，σ
  離開並重複使用（σ cycle），core + NusA 延長。σ⁷⁰ housekeeping、σ³² heat shock、σ⁵⁴（−24/−12，需 enhancer 活化子）。Rifampicin 結合 β 次單元。

  【補充】σ factors choose the promoter: σ^{70} housekeeping (spacer 16–19 bp), σ^{32} heat shock, σ^{54} nitrogen genes (−24/−12; needs an ATP-using enhancer-binding activator). σ region 4.2 binds −35, region
  2.4 binds −10, region 2.3 melts DNA. −10 and −35 lie on the same face of B-DNA (~10.5 bp/turn). Rifampicin binds β and blocks the exit channel (abortive stage); actinomycin D intercalates in DNA. Footprinting
  maps the promoter (RNA pol covers 60–80 bp, including −35 and −10).'
