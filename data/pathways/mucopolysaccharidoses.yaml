notes_zh: 黏多醣症（MPS）：溶體分解 GAG 的酵素缺乏，GAG 堆積、尿中 GAG 上升；共同表現為粗糙臉孔、骨骼變形、肝脾腫大、智能退化。口訣：Hunter「看得清楚獵物」→ 無角膜混濁、X-linked；Hurler 有角膜混濁、體染色體隱性。DS = dermatan sulfate，HS = heparan sulfate，KS = keratan sulfate，CS = chondroitin
  sulfate。I-cell disease（mucolipidosis II）：GlcNAc phosphotransferase 缺乏，無法加上 mannose-6-phosphate 標籤。
