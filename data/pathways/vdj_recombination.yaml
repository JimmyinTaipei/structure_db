notes_zh: 'B、T 細胞發育時，抗體重鏈先 D–J、再 V–DJ 接合（輕鏈只有 V–J）。RAG1/2 在 RSS（heptamer–12 或 23 bp spacer–nonamer）切開，遵守 12/23 規則；編碼端形成髮夾，由 Artemis 打開，TdT 加 N 核苷酸，NHEJ 接合 → 接合多樣性。中間 DNA 以環狀切除（signal joint）。下游未用到的 J（如 J3–J6）留在
  DNA 上，轉錄後由 RNA splicing 去除。RAG、Artemis 缺陷 → SCID。

  【補充】RSS = heptamer – spacer (12 or 23 bp) – nonamer; 12/23 rule: a 12-RSS pairs only with a 23-RSS. RAG1/2 make hairpin coding ends, Artemis opens them, TdT adds N nucleotides → junctional diversity.
  RAG or Artemis defect → SCID (no B and T cells).'
