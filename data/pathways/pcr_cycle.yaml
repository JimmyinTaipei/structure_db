notes_zh: 一對 primer（15–25 nt，分別結合兩股的 3′ 端）、Taq DNA polymerase（Thermus aquaticus，耐熱、無 3′→5′ 校對）、dNTP、Mg²⁺。每循環：95 °C 變性 → 50–65 °C 黏合（約 Tm − 5；Tm ≈ 4(G+C) + 2(A+T)）→ 72 °C 延長。n 個循環產物約 2ⁿ（嚴格長度的 amplicon =
  2ⁿ − 2n）。應用：診斷、STR／DNA 指紋、RAPD、RT-PCR（先反轉錄）。高保真 PCR 用 Pfu（有校對）。
