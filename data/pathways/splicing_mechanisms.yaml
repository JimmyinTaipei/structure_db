notes_zh: '三種都是兩次轉酯。Group I：游離 G（GTP/guanosine）的 3′-OH 攻擊 5′ss，intron 以線形（5′ 端帶 G）釋出（Tetrahymena rRNA，Cech）。Group II：intron 內 A 的 2′-OH 攻擊，產生 lariat（胞器）。Spliceosome：同 group II 化學，但需 snRNP。核內 pre-tRNA intron
  由酵素（endonuclease + ligase）切除。

  【補充】All three use two transesterifications. Group II introns and the spliceosome share the lariat chemistry (group II is the likely ancestor; also LINE-like retrohoming). Nuclear pre-tRNA introns are
  removed by proteins instead (endonuclease + ligase, uses ATP). Cech (self-splicing) and Altman (RNase P) — ribozymes, Nobel 1989.'
