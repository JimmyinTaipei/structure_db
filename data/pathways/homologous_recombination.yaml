notes_zh: '雙股斷裂（或停住的複製叉）以同源姊妹染色分體為模板，無誤修復。E. coli：RecBCD（helicase + nuclease）處理斷端直到 chi 序列 → 留下 3′ 單股尾端 → RecA 包覆並搜尋同源 → 股入侵形成 D-loop → 延伸 → Holliday junction → RuvA（認 HJ）＋RuvB（ATP，branch migration）→ RuvC（resolvase）切開。真核：MRN、CtIP、BRCA1、BRCA2–Rad51。RecA
  也是 SOS 的共蛋白酶。減數分裂交換也走 HR。

  【補充】Error-free repair of DSBs and stalled forks (S/G2: needs the sister chromatid). Eukaryotes: MRN (Mre11–Rad50–Nbs1) + CtIP resect, BRCA1, BRCA2–Rad51. Defects: BRCA1/2 (breast / ovarian cancer; PARP
  inhibitors), ataxia telangiectasia (ATM), Bloom (BLM helicase), Werner (WRN).'
