notes_zh: N 個胺基酸的蛋白質：活化 2N + 起始 1 + EF-Tu (N−1) + EF-G (N−1) = 4N − 1 個高能磷酸鍵；講義另計 RF3 為 4N。Lehninger 只寫「每個胜肽鍵至少 4 個高能磷酸當量」（6e p.1139）。
