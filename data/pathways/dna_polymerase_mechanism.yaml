notes_zh: 'DNA polymerase 外形如右手（palm、fingers、thumb）。Palm 上的 Asp 抓住兩個 Mg²⁺：一個活化引子的 3′-OH，另一個穩定 dNTP 的三磷酸。3′-OH 攻擊進來 dNTP 的 α-磷酸 → 形成 3′,5′-磷酸二酯鍵，釋出 PPi；pyrophosphatase 水解 PPi 使反應不可逆。需要引子（3′-OH），新股只能 5′→3′。校對：3′→5′
  exonuclease；DNA pol α、β、反轉錄酶、Taq 沒有。E. coli Pol I 另有 5′→3′ exonuclease（去除引子、nick translation）；Klenow fragment 去掉了這段。

  【補充】New strand grows 5''→3'' only; template read 3''→5''. A primer with a free 3''-OH is required (no de novo start; primase/RNA pol can start). Proofreading: mismatch → 3'' end shifts to the 3''→5''
  exonuclease site (Pol I, III, δ, ε; absent in Pol α, β, RT, Taq). Error ~10^{-9} with MMR.'
