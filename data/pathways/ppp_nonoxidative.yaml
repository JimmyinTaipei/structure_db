notes_zh: 非氧化期：Ru5P 經 isomerase → R5P（核苷酸）或 3-epimerase → Xu5P。Transketolase（TPP）把酮糖供體（Xu5P）的 C1–C2 轉給醛糖受體；transaldolase 轉 C1–C3（不需 TPP，Schiff base）。口訣：酮糖（上盤）供、醛糖（底座）受；TK「左 2」、TA「右 3」。全部可逆：需 NADPH 多於 R5P
  時 → 轉成 F6P、GAP 回糖解；需 R5P 多於 NADPH（分裂中細胞）→ 由 F6P、GAP 逆向生成 R5P，不經氧化期。¹⁴C：glucose C1 在 6PG DH 以 CO₂ 離開。紅血球 transketolase 活性可評估 thiamine（B₁）狀態（Wernicke）。
