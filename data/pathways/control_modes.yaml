notes_zh: 依調節蛋白結合 DNA 後的效果：結合即關 = negative control（repressor），結合即開 = positive control（activator）。依小分子：存在使基因開 = induction（inducer），存在使基因關 = repression（corepressor）。Negative inducible：lac（allolactose 使 LacI
  離開）；negative repressible：trp（Trp 使 TrpR 結合）；positive inducible：CAP–cAMP、AraC–arabinose。沒有調節 = constitutive（如 lac O^c 突變、管家基因）。
