notes_zh: 每一層都是酵素 → 訊號放大（enzyme cascade）：一個 epinephrine 可使數百萬個 glucose 釋出。PKA = R₂C₂；每個 R 結合 2 個 cAMP（共 4 個）→ 釋出 2 個 C；AKAP 把 PKA 錨定在特定位置（localized response）。PKA 兩條路：① 直接磷酸化代謝酵素（phosphorylase kinase、glycogen
  synthase、PFK-2/FBPase-2、HSL、ACC）② 入核磷酸化 CREB，結合 CBP/p300 → 轉錄。終止：Gα 水解 GTP、PDE 分解 cAMP、phosphatase、受體被 GRK 磷酸化後由 β-arrestin 去敏感化。
