notes_zh: "D/L 由離羰基最遠的立體中心決定（洋紅）：OH 在右 = D。天然糖幾乎都是 D 型（胺基酸是 L 型）。L-glucose 是 D-glucose 的鏡像（每個中心都反過來），不是 epimer。"
