notes_zh: 'Recombinase 在短的特定序列切開再接回，不需 DNA 合成與 RecA。直接重複 → 整合或切除（λ phage：attP × attB 由 integrase + IHF 整合成溶源，attL/attR；切除需 Xis）；反向重複 → 倒轉（Salmonella 鞭毛相變異 Hin）。Cre–loxP（P1 phage）用於條件式基因剔除。

  【補充】Recombinase (Tyr or Ser family) cuts and rejoins at short specific sites, no DNA synthesis, no RecA. Direct repeats → excision / integration; inverted repeats → inversion. Cre–loxP (P1 phage) is used
  for conditional knock-outs.'
