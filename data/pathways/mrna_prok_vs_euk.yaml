notes_zh: '原核：polycistronic（一條 mRNA 多個 ORF，各有 SD + AUG）、無核膜 → 轉錄與轉譯偶聯、無 intron、無 5′ cap、無 poly(A)。真核：monocistronic、核內加工（5′ cap、剪接、3′ poly(A) ~250 A）後出核轉譯。兩者都有 5′UTR、3′UTR。

  【補充】Prokaryotic mRNA: no cap, no introns, no poly(A) tail; 5′-ppp end; half-life of minutes. Both have 5′ and 3′ UTRs. Eukaryotic mRNA: 5′ m⁷G cap, introns removed, 3′ poly(A); exported through nuclear
  pores before translation.

  【補充】each ORF has its own Shine–Dalgarno + AUG; ribosomes (purple) load before transcription ends'
