notes_zh: Isoprene（C₅）單位 = IPP／DMAPP（由 mevalonate 途徑；植物與細菌另有 MEP 途徑）。衍生：cholesterol（→ 膽酸、vitamin D、固醇類荷爾蒙）、脂溶性維生素 A、E、K（D 由 cholesterol 而來）、CoQ（ubiquinone 的側鏈）、dolichol（N-linked glycosylation 載體）、farnesyl／geranylgeranyl（Ras
  等蛋白質 prenylation）、heme A、carotenoid／lycopene。
