notes_zh: 間接（未結合）膽紅素 ↑：溶血、新生兒、Gilbert（UGT1A1 ↓，壓力或空腹時輕度黃疸）、Crigler–Najjar（I 型完全缺乏 → 核黃疸）。直接（結合）膽紅素 ↑：Dubin–Johnson（MRP2，肝色黑）、Rotor、膽道阻塞（灰白便、茶色尿、尿 urobilinogen ↓）。heme oxygenase 是體內 CO 的唯一來源。
