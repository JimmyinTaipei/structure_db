notes_zh: 'ρ-independent（intrinsic）：DNA 的反向重複（palindrome）使 RNA 形成 GC-rich 莖環，接著 6–8 個 U；聚合酶停頓、rU·dA 雜合弱 → 釋放。ρ-dependent：ρ 六聚體（RNA–DNA helicase，ATP）結合 rut site（C 多 G 少、無二級結構），沿 RNA 5′→3′ 追上聚合酶、拆開雜合。Bicyclomycin
  抑制 ρ。真核 Pol II：poly(A) 位切開後 Xrn2 torpedo；Pol III：模板上一串 T。

  【補充】Intrinsic: GC-rich stem (stable) followed by 6–8 U; the polymerase stalls and the A=U hybrid melts. ρ-dependent: no hairpin needed; inhibited by bicyclomycin; NusA helps intrinsic termination, NusG
  helps ρ. Eukaryotes: Pol II — cleavage at the poly(A) site, then the 5′→3′ exonuclease Xrn2 (''torpedo'') catches the polymerase; Pol III — a run of T in the template (no hairpin); Pol I — terminator
  protein (TTF-I).'
