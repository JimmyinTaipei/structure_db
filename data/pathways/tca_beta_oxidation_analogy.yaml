notes_zh: 同一組三步化學：–CH₂–CH₂– 經 FAD 脫氫成 trans 雙鍵 → 加水成 β-OH（L 型）→ NAD⁺ 脫氫成 β-酮。TCA 第 6–8 步（SDH、fumarase、MDH）＝β 氧化的 acyl-CoA DH、enoyl-CoA hydratase、3-hydroxyacyl-CoA DH ＝支鏈胺基酸（Ile、Val、Leu）分解中段。為什麼 C–C 脫氫用
  FAD？烷→烯的 ΔE°′ 不足以還原 NAD⁺；醇→酮才用 NAD⁺。SDH 是 ETC complex II（唯一嵌在內膜的 TCA 酵素）。
