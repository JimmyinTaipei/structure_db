notes_zh: 'Transcription bubble ~17 bp，RNA–DNA hybrid ~8 bp。RNA 5′→3′ 合成，與 template 反向平行、序列同 coding strand（U 取代 T）；不需 primer。無 3′→5′ 外切校對，但可 backtrack 由 GreA/B（原核）或 TFIIS（真核）切除錯誤 3′ 端。Twin-supercoiling
  domain：前方 (+) 超螺旋由 gyrase 解、後方 (−) 由 topo I 解。延長因子：NusA；TFIIS、P-TEFb、elongin。

  【補充】RNA is made 5′→3′, antiparallel to the template; its sequence equals the coding (sense) strand with U for T. No primer is needed. E. coli ~50–90 nt/s. No 3′→5′ proofreading exonuclease (error ~10^{-4}–10^{-5});
  a misincorporation makes the enzyme backtrack and GreA/B (E. coli) or TFIIS (eukaryotes) cleave the 3′ end. Twin-domain model: topo I removes (−) behind, gyrase removes (+) ahead. Elongation factors:
  NusA (E. coli); TFIIS, P-TEFb (CTD Ser2 kinase), elongin (eukaryotes).'
