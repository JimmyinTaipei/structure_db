notes_zh: 外源：乳糜微粒（腸，apoB-48）→ LPL（需 apoC-II）→ 殘餘物由肝經 apoE 回收。內源：VLDL（肝，apoB-100）→ IDL → LDL → LDL receptor（家族性高膽固醇血症：受體缺陷）。HDL：apoA-I、LCAT 酯化，逆向膽固醇運輸；CETP 把膽固醇酯換到 VLDL／LDL。Ⅰ型（LPL 或 apoC-II 缺乏）→ 乳糜微粒血症、胰臟炎；Ⅲ型
  apoE2；Tangier（ABCA1）HDL 極低；abetalipoproteinemia（MTP）。
