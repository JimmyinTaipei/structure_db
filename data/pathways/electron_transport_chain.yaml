notes_zh: 橙色箭頭＝電子流（NADH → I → Q → III → cyt c → IV → O₂；succinate → II → Q）；洋紅箭頭＝質子流。每對電子：NADH 打出 10 H⁺（I 4、III 4、IV 2），FADH₂ 6 H⁺。ATP synthase 約 4 H⁺/ATP（含 Pi 運輸）→ P/O：NADH 2.5、FADH₂ 1.5。抑制劑：I rotenone、amytal；II
  malonate；III antimycin A；IV CN⁻、CO、N₃⁻、H₂S；V oligomycin；ANT atractyloside。uncoupler 讓 H⁺ 繞過 ATP synthase：O₂ 消耗 ↑、ATP ↓、體溫 ↑（UCP1 = thermogenin，新生兒棕色脂肪）。
