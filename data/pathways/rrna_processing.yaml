notes_zh: 'E. coli：rrn operon 產生 30S pre-rRNA（16S、tRNA、23S、5S），由 RNase III 等切開 → 30S、50S → 70S。真核：Pol I 在核仁產生 45S pre-rRNA（18S、5.8S、28S，夾 ETS 與 ITS），5S 由 Pol III 另外轉錄 → 40S、60S → 80S。修飾：C/D box snoRNA →
  2′-O-甲基化；H/ACA box snoRNA → pseudouridylation（dyskerin，dyskeratosis congenita）。

  【補充】Modification guided by snoRNPs (snoRNA + enzyme): C/D-box snoRNA → 2′-O-methylation (fibrillarin); H/ACA-box snoRNA → pseudouridylation (dyskerin; mutated in dyskeratosis congenita). E. coli modifies
  rRNA with enzymes alone (no snoRNA). U3 snoRNA guides 5′ETS cleavage; RNase MRP cuts ITS1. Ribosomes are assembled in the nucleolus and exported as subunits. The rRNA (23S / 28S) catalyses peptide bonds:
  a ribozyme.'
