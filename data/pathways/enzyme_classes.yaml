notes_zh: EC 分類（口訣 OTHLIL＋T）：1 氧化還原（dehydrogenase、oxidase、oxygenase）；2 轉移官能基（kinase、transaminase）；3 水解（protease、lipase、nuclease、phosphatase）；4 Lyase：非水解、非氧化地加成或移除基團形成雙鍵（decarboxylase、aldolase、hydratase；synthase
  不耗 ATP，如 citrate synthase 屬 lyase）；5 異構（mutase、epimerase、racemase）；6 Ligase：耗 ATP 形成鍵（synthetase、carboxylase）；7 Translocase：跨膜運送（2018 新增）。點箭頭可跳到例子反應。
