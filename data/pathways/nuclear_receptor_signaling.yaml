notes_zh: Type I（glucocorticoid、mineralocorticoid、sex steroids）：細胞質中與 HSP90 結合；激素穿膜結合後 HSP90 離開 → 同源二聚 → 入核 → 以 Zn-finger DBD 結合 HRE（反向重複）→ 招募 coactivator（HAT）。Type II（thyroid、retinoic acid、vitamin D、PPAR）：已在核內與
  RXR 異源二聚、無激素時結合 corepressor（HDAC），激素結合後換成 coactivator。結構：AF-1、DBD（兩個 Cys₄ 鋅指）、LBD/AF-2。
