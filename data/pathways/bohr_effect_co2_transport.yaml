notes_zh: Bohr effect：組織 CO₂ 多 → carbonic anhydrase 產生 H⁺ → H⁺ 結合 Hb（β His146 與 Asp94 形成鹽橋）→ 穩定 T 態、放出 O₂。肺部 O₂ 高 → 轉成 R 態釋出 H⁺ → 與 HCO₃⁻ 變回 CO₂ 呼出。CO₂ 也直接接在 N 端胺基形成 carbamate（–NH–COO⁻），同樣穩定 T 態。運輸形式：HCO₃⁻（~70
  %，chloride shift）、carbamino-Hb（~20 %）、溶解（~10 %）。
