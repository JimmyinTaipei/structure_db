notes_zh: EMSA（gel shift）：標記 DNA 與蛋白質結合後跑得較慢 → 上移；加抗體 → supershift；加過量未標記 DNA（cold competitor）→ 競爭掉。DNase I footprinting：結合處受保護，ladder 出現空缺（footprint）→ 定出結合序列；methylation interference / protection 亦可。ChIP：甲醛交聯
  → 切碎染色質 → 抗體沉澱蛋白質 → 解交聯 → PCR / 定序（ChIP-seq）找體內結合位點。其他：filter binding、yeast one-hybrid、reporter（luciferase）assay。
