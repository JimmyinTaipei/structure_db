notes_zh: E. coli 一種 RNA pol 合成所有 RNA。真核：Pol I（核仁，45S pre-rRNA → 28S、18S、5.8S）、Pol II（mRNA、多數 snRNA、miRNA）、Pol III（tRNA、5S rRNA、U6 snRNA、7SL）。α-amanitin（毒蕈）：Pol II 最敏感、Pol III 中度、Pol I 不敏感。粒線體 RNA pol 為單一次單元（似
  T7）。
