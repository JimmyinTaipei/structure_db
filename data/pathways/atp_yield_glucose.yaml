notes_zh: 糖解淨 2 ATP＋2 NADH（細胞質）；PDH 2 NADH；TCA 2 GTP（ATP）＋6 NADH＋2 FADH₂。以 NADH 2.5、FADH₂ 1.5 計算：糖解 2＋(3 或 5)，PDH 5，TCA 2＋15＋3 → 30（G3P shuttle）或 32（Mal–Asp shuttle）。舊教科書的 36／38 是用 P/O 3 與 2 計算。無氧時只有糖解的
  2 ATP（NAD⁺ 由 LDH 再生）。
