notes_zh: 同一對受質由兩個不同的不可逆酵素正反向轉換，若同時進行，淨結果只是水解 ATP 產熱（substrate cycle）。用途：① 產熱（熊蜂飛行肌 PFK-1／FBPase-1；malignant hyperthermia 為另一種 Ca²⁺ 循環）② 放大訊號：兩方向同時被反向調控（F2,6BP 活化 PFK-1、抑制 FBPase-1），淨流量的變化比單一酵素變化大很多（筆記例：+20
  % 與 −30 % → 淨流量變化 98 %）。正常情況下由 insulin／glucagon 互惠調控，避免同時進行。
