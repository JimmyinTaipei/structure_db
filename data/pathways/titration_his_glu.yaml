notes_zh: 三個可解離基團 → 三個緩衝區。pI = 淨電荷 0 那一型兩側的 pK 平均：His（鹼性）pI = (6.0 + 9.2)/2 ≈ 7.6；Glu（酸性）pI = (2.2 + 4.3)/2 ≈ 3.2。His 的 pK_R ≈ 6 接近生理 pH → 蛋白中的緩衝（如 Hb His146 的 Bohr effect）、酵素 general acid/base。
