notes_zh: GroEL（Hsp60）為兩個七聚體環背對背疊成的圓柱；GroES（Hsp10）為七聚體蓋子。① 未摺疊蛋白暴露的疏水區結合在開放環（cis）頂端的疏水內壁；② 7 ATP 與 GroES 結合 → 構形大幅改變，腔室變大、內壁變親水 → 蛋白質被推入孤立空間自行摺疊（約 10 秒）；③ ATP 水解；④ 另一端（trans）環結合 ATP 與新受質 → GroES 與摺好的蛋白質離開。尚未摺好可再進一次循環。真核胞質對應
  TRiC（CCT），粒線體為 Hsp60/Hsp10。Hsp70（DnaK）則在轉譯中結合新生鏈的疏水片段。
