notes_zh: NADH 本身不能通過粒線體內膜。細胞質的 NADH 把 OAA 還原成 malate → malate–α-KG antiporter 進入基質 → 再氧化成 OAA，在基質內重新產生 NADH（→ Complex I，約 2.5 ATP）。OAA 也不能出膜，所以先轉胺成 Asp，經 Glu–Asp antiporter（aralar／citrin）出去。主要在肝、心、腎。citrin
  缺乏 → 成人型 citrullinemia type II。可逆，依 NADH/NAD⁺ 比例決定方向。
