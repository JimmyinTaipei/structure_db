notes_zh: '兩步：aa + ATP → aa~AMP + PPi；aa~AMP + tRNA → aa-tRNA + AMP（每個胺基酸 2 個高能鍵）。Class I 接 2′-OH、class II 接 3′-OH。辨識 anticodon 與 acceptor stem / discriminator base（second genetic code，tRNA^{Ala} 的 G3·U70）。Double-sieve
  校對（IleRS 剔除 Val）。

  【補充】Step 1 (activation): aa + ATP → aa~AMP + PP_i (PP_i hydrolysed → 2 high-energy bonds per amino acid). Step 2: aa~AMP + tRNA → aa-tRNA + AMP. Class I aaRS (Rossmann fold, monomeric) attach the aa to
  the 2′-OH of A76, then it moves to 3′-OH; class II (dimeric, antiparallel β) attach directly to 3′-OH. Specificity (''second genetic code''): anticodon + acceptor stem / discriminator base (tRNA^{Ala}:
  one G3·U70 pair is enough). Proofreading (double sieve): IleRS activates Val by mistake (~1/200) and hydrolyses Val-AMP / Val-tRNA^{Ile} in an editing site → error ~1/50 000. Indirect routes: Glu-tRNA^{Gln}
  → Gln-tRNA^{Gln} (amidotransferase, many bacteria); Ser-tRNA^{Sec} → Sec-tRNA^{Sec} (selenocysteine).'
