id: starvation_fuel_plot
title: Plasma fuels during starvation
layout: plot
plot:
  size:
  - 16
  - 10
  x:
    min: 0
    max: 40
    label: days of starvation
    ticks:
    - 0
    - 10
    - 20
    - 30
    - 40
  y:
    min: 0
    max: 10
    label: plasma concentration (mM)
    ticks:
    - 0
    - 2
    - 4
    - 6
    - 8
    - 10
  curves:
  - id: bhb
    y: 6.1*(1-exp(-x/8))
    color: red
  - id: glc
    y: 3.0 + 1.0*exp(-x/25) + 0.7*exp(-x/0.8)
    color: cyan
  - id: ffa
    y: 0.5 + 0.8*(1-exp(-x/1.5)) + 0.35*x/40
    color: orange
  - id: aca
    y: 1.35*(1-exp(-x/6))
    color: magenta
  legend:
    at:
    - 2
    - 9.7
    items:
    - curve: bhb
      text: β-hydroxybutyrate
    - curve: glc
      text: glucose
    - curve: ffa
      text: free fatty acids
    - curve: aca
      text: acetoacetate
tags:
- energy_metabolism
- integration
notes_zh: 依 Lehninger 6e 圖 23–31 的趨勢重畫（非精確數值）。血糖 2 天內即下降並維持約 3.5 mM；游離脂肪酸上升；酮體（以 β-hydroxybutyrate 為主）在 2–4 天後大幅上升到約 6–7 mM，腦改用酮體供應約 60–70 % 能量 → 糖質新生需求下降、肌肉蛋白分解減緩（尿素排泄由第 1–3 天約 30 g/天降到數週後約 10 g/天）。脂肪耗盡後才再分解蛋白質（含心肌、呼吸肌）→
  死亡。
parts_png: false
status: pending
