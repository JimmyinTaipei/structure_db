notes_zh: UDP-glucose 是醣類互換的樞紐（高能活化醣）：→ 肝醣；→ UDP-galactose（4-epimerase）→ 乳糖、醣蛋白；→ UDP-glucuronate（2 NAD⁺）→ 結合解毒、GAG。Galactose 經 GALT 換成 G1P 進入主線；fructose 在肝經 fructokinase、aldolase B 成為三碳糖（繞過 PFK-1，不受 insulin／PFK-1
  調控 → 代謝比 glucose 快）。缺乏：GALT → classic galactosemia；aldolase B → hereditary fructose intolerance；fructokinase → essential fructosuria（良性）。
