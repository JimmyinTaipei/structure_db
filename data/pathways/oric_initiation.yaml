notes_zh: 'oriC 245 bp：3 個 13-mer（DUE，AT-rich，先解開）＋ 多個 9-mer DnaA box。訊號：完全甲基化的 GATC（11 個，Dam methylase）。DnaA–ATP 多聚化並纏繞 DNA（IHF、HU、FIS 協助彎曲，gyrase 提供負超螺旋）→ DUE 打開 → DnaC（helicase loader）把 DnaB 六聚體裝到兩條單股上
  → SSB → DnaG primase 合成引子 → Pol III 全酶 → replisome。防止重複起始：SeqA 結合半甲基化 GATC；DnaA–ATP 被水解成 DnaA–ADP。primosome = DnaB + DnaG。

  【補充】oriC (245 bp): 11 GATC sites — fully methylated (Dam) = ready; hemimethylated → SeqA blocks re-initiation'
