notes_zh: 細菌的適應性免疫（spacer 記住噬菌體序列）。Cas9 + sgRNA（20 nt 引導 + scaffold）找到互補 DNA，緊鄰 PAM（NGG）時，在 PAM 上游 3 bp 切斷雙股（HNH、RuvC）。NHEJ → 插入／缺失 → frameshift 剔除（knock-out）；有 donor 模板時 HDR → 精確修改或嵌入（knock-in）。dCas9（無切割）+
  抑制子 = CRISPRi（knock-down 轉錄）、+ 活化子 = CRISPRa。比較：Cre–loxP（條件式剔除）、siRNA / miRNA（mRNA 層次 knock-down）。
