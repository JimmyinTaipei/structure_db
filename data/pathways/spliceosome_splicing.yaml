notes_zh: 'U1 認 5′ss（GU）、U2 認 branch point A（A 突出）、U2AF 認 Py tract 與 3′ AG → U4/U6·U5 加入 → U1、U4 離開 → U6 與 5′ss、U2 配對成 RNA 催化中心（ribozyme）。第一次轉酯：branch A 的 2′-OH 攻擊 5′ss → exon 1 3′-OH + lariat（2′–5′ 鍵）；第二次：exon
  1 3′-OH 攻擊 3′ss → exon 接合、lariat 釋出。Major（U2 型，GU–AG，>99 %）；minor（U12 型，AU–AC：U11、U12、U4atac、U6atac）。

  【補充】Two transesterifications: the number of phosphodiester bonds does not change (no ATP for the chemistry; ATP drives the RNA helicases that remodel snRNPs). Major (U2-type) GU–AG introns > 99 %; minor
  (U12-type) AU–AC introns use U11, U12, U4atac, U6atac + U5. snRNAs are U-rich; U3 is a snoRNA (rRNA processing), not a splicing snRNA. Splice-site mutations: β-thalassaemia; SMN2 exon-7 skipping (spinal
  muscular atrophy). Anti-Sm (snRNP) antibodies in SLE.'
