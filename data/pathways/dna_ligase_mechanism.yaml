notes_zh: Ligase 封閉 nick：需要相鄰的 3′-OH 與 5′-磷酸（雙股 DNA 中）。① 酵素的 Lys 與 ATP（真核、T4）或 NAD⁺（E. coli）反應形成 Lys–AMP，放出 PPi（或 NMN）；② AMP 轉到 nick 的 5′-磷酸上（5′-5′ 焦磷酸鍵，活化）；③ 3′-OH 攻擊活化的磷酸形成磷酸二酯鍵，放出 AMP。用途：延遲股 Okazaki
  片段、修復最後一步、重組 DNA（T4 ligase 可接平端）。
