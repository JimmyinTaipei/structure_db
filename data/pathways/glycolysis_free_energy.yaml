notes_zh: 紅血球中實際 ΔG（Lehninger）：只有 hexokinase（−33.4）、PFK-1（−22.2）、pyruvate kinase（−16.7 × 2）三步大幅負值 → 不可逆、為調控點，糖質新生必須以 G6Pase、FBPase-1、PC + PEPCK 繞過。其餘七步 ΔG ≈ 0，接近平衡，兩方向共用。ΔG°′ 為正的步驟（aldolase +23.8、TPI +7.5
  kJ/mol）在細胞內因產物迅速移除而 ΔG ≈ 0。第 6–10 步每分子葡萄糖做兩次。
