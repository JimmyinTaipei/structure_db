notes_zh: 三種毒素都是 ADP-ribosyltransferase：把 NAD⁺ 的 ADP-ribose 接到目標蛋白（釋出 nicotinamide）。Cholera：Gsα 的 Arg → GTPase 失活 → AC 持續 → 腸道 cAMP ↑ → CFTR 分泌 Cl⁻ → 水瀉。Pertussis：Giα 的 Cys → Gi 無法被受體活化 → 無法抑制 AC → cAMP
  ↑。Diphtheria（Pseudomonas exotoxin A 同）：eEF2 的 diphthamide（修飾的 His）→ 轉位停止 → 蛋白質合成停止。
