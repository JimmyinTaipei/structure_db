notes_zh: PLA₁ 水解 sn-1 酯鍵；PLA₂ 水解 sn-2 酯鍵（釋出 arachidonate → eicosanoid；corticosteroid 經 lipocortin/annexin 抑制；蛇毒、胰臟 PLA₂）；PLC 切甘油 O–P 之間 → DAG + 磷酸頭基（PIP₂ → DAG + IP₃，Gq 訊號；細菌 α-toxin 為 PLC）；PLD 切 P–O（頭基一側）→
  phosphatidate + choline。Lysophospholipid 有清潔劑性質（溶血）。
