notes_zh: 多數以 α-helix 嵌入 major groove（氫鍵多），以 Arg、Gln、Asn 辨識鹼基。HTH：CAP、LacI、Cro、homeodomain。Zinc finger：Cys₂His₂（TFIIIA、Sp1）、Cys₄（核受體：steroid、thyroid、retinoic acid、vitamin D receptor）。Leucine zipper（bZIP）：每
  7 個胺基酸一個 Leu 形成 coiled-coil 二聚，鹼性區抓 DNA（c-Fos/c-Jun = AP-1、CREB）。bHLH：MyoD、Myc/Max。例外：TBP 以 β-sheet 結合 TATA 的 minor groove。
