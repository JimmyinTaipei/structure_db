notes_zh: 'Core promoter：BRE、TATA box（−30，TATAAA，Hogness box）、Inr（+1）、DPE（+30）。組裝：TFIID（TBP 認 TATA、使 DNA 彎曲）→ IIA → IIB → Pol II·IIF → IIE → IIH。TFIIB 似 σ（決定起點），TFIIF 唯一先與 Pol II 結合，TFIIH 有 helicase（XPB，也參與
  NER）與 CTD kinase（CDK7，Ser5）→ promoter clearance；P-TEFb（CDK9）磷酸化 Ser2 → 延長。CTD = 52 個 YSPTSPS 重複，作為 cap、剪接、poly(A) 因子的平台。

  【補充】TFIID = TBP + TAFs; reads TATA, Inr, DPE (TBP is also used by Pol I and Pol III). TFIIA stabilises TBP–DNA. TFIIB bridges TBP and Pol II and picks +1 (σ-like). TFIIF escorts Pol II. TFIIE recruits
  TFIIH. TFIIH: helicase (XPB) opens the promoter (ATP); CDK7 phosphorylates CTD Ser5 → promoter clearance; TFIIH also works in NER. Ser5-P CTD recruits the capping enzymes; P-TEFb (CDK9) phosphorylates
  Ser2 → productive elongation and loading of splicing and poly(A) factors. Unphosphorylated Pol II (IIA) joins the PIC; phosphorylated Pol II (IIO) elongates. α-Amanitin blocks Pol II translocation.'
