notes_zh: 脂雙層的通透性取決於大小與極性：氣體（O₂、CO₂、N₂、NO）與疏水小分子（steroid、乙醇）自由擴散；小的不帶電極性分子（H₂O、urea、glycerol）緩慢通過（水另經 aquaporin）；較大的極性分子（glucose、fructose）幾乎不能通過，需 transporter；所有離子（Na⁺、K⁺、Ca²⁺、Cl⁻、H⁺）與帶電分子（胺基酸、ATP、核苷酸）不能通過，需
  channel、transporter 或 pump。
