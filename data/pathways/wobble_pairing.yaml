notes_zh: '密碼子第 3 位與反密碼子第 1 位（5′ 端）可擺動：G–C/U、U–A/G、I–U/C/A；C、A 只認一種。前兩位嚴格配對。≥ 32 種 tRNA 即可讀 61 個密碼子；同一胺基酸的不同 tRNA = isoaccepting tRNA。

  【補充】The first two codon positions pair strictly (Watson–Crick); the third is loose, so one tRNA reads several codons. ≥ 32 tRNAs (31 + initiator) read 61 codons. Isoaccepting tRNAs: different tRNAs for
  the same amino acid (e.g. tRNA^{Ala}_1 anticodon IGC reads GCU/GCC/GCA; tRNA^{Ala}_2 CGC reads GCG). Inosine at the wobble position comes from A → I editing by ADAT. Two codons differing only at the third
  base (pyrimidine-ending) always code the same amino acid.'
