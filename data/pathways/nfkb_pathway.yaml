tags:
- signal_transduction
notes_zh: NF-κB 平時被 IκB 留在細胞質。TNF-α、TLR（細菌 LPS、病毒）、UV → IKK 磷酸化 IκB → 泛素化 → proteasome 分解 → NF-κB 露出 NLS 入核 → 發炎細胞激素、抗凋亡基因。Glucocorticoid 誘導 IκB 合成 → 抗發炎；aspirin（高劑量）抑制 IKK。
status: pending
