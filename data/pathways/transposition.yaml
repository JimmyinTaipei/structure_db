notes_zh: 'Transposon（跳躍基因、mobile element）。細菌：IS（只有 transposase，兩端反向重複）、composite（IS–抗藥基因–IS，Tn10、Tn5）、Tn3（transposase + resolvase + 抗藥基因）、phage Mu。非複製型（cut-and-paste）：轉位子離開原處；複製型（copy-and-paste）：原處保留一份。插入處兩側產生短的直接重複（target-site
  duplication）。真核以 retrotransposon 為主：RNA → 反轉錄酶 → cDNA 再插入；LTR 型（似反轉錄病毒）、LINE（L1，自主，有 RT）、SINE（Alu，約 300 bp，需借 L1 的 RT）。

  【補充】Retrotransposons (eukaryotes) copy via RNA → reverse transcriptase → cDNA: LTR type (retrovirus-like) and non-LTR LINEs (L1, autonomous, encode RT) and SINEs (Alu ~300 bp, non-autonomous, use L1''s
  RT). ~45 % of the human genome is transposon-derived; only ~1–2 % codes for protein.'
