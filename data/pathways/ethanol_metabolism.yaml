notes_zh: 兩次脫氫都產生 NADH → 肝細胞 NADH/NAD⁺ 大增：pyruvate → lactate（乳酸中毒、乳酸與尿酸競爭排泄 → 痛風）；OAA → malate、pyruvate 被耗 → 糖質新生 ↓ → 空腹低血糖（尤其營養不良、肝醣耗竭時）；β 氧化與 TCA 被抑制、DHAP → G3P ↑ → TAG 堆積（脂肪肝）；acetyl-CoA 轉向酮體（酒精性酮酸中毒，以
  β-hydroxybutyrate 為主）。甲醇（失明）與乙二醇（草酸 → 腎衰竭）都經 ADH 活化，以 fomepizole 阻斷。
