notes_zh: 初級膽酸（肝）：cholate（3α,7α,12α）、chenodeoxycholate（3α,7α）；與 glycine 或 taurine 結合 → 膽鹽（兩性、乳化脂質、形成 micelle、吸收脂溶性維生素）。腸道細菌去結合並去掉 7α-OH → 次級膽酸 deoxycholate、lithocholate。約 95% 在迴腸末端回收（腸肝循環，每天 6–10 次）。迴腸切除或
  Crohn → 膽酸流失 → 脂肪瀉、膽結石（膽固醇過飽和）。ursodeoxycholate 治療膽固醇結石、PBC。
