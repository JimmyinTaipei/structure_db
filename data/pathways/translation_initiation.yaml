notes_zh: '原核：30S + IF3 + IF1 + IF2·GTP·fMet-tRNA + mRNA（SD 與 16S rRNA 3′ 端配對）→ 50S 加入、IF2 水解 GTP、IF 離開 → 70S 起始複合體（fMet-tRNA 在 P）。真核：43S（40S + eIF1/1A/3 + eIF2·GTP·Met-tRNAi）+ eIF4F（4E 認 cap、4G 支架、4A helicase）與
  PABP 活化的 mRNA → 48S 以 ATP 掃描至 Kozak 序列中的 AUG → eIF5 使 eIF2 水解 GTP、eIF5B 帶 60S → 80S。eIF2α 磷酸化 → 抑制 eIF2B → 整體轉譯關閉。

  【補充】Bacteria: IF3 keeps 30S apart from 50S and checks the start codon; IF1 blocks the A site; IF2·GTP brings fMet-tRNA_{fMet} to the P site. Start codons AUG (GUG, UUG). Methionine is formylated on the
  tRNA (N10-formyl-THF transformylase); deformylase and Met aminopeptidase later trim the N terminus. Eukaryotes: 43S = 40S + eIF1, 1A, 3 + eIF2·GTP·Met-tRNA_i; eIF4F + PABP activate the mRNA (closed loop)
  → 48S scans to the first AUG in a Kozak context. eIF2-GDP is recycled by eIF2B (GEF); eIF2α phosphorylation (PKR, PERK, GCN2, HRI) blocks this — global shut-off. IRESs (viruses) bypass the cap.'
