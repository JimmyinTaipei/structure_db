notes_zh: Activator 的 DNA-binding domain 結合 enhancer（可遠在數千 bp 外、方向不拘），activation domain（acidic：Gal4；Pro-rich：CTF1；Gln-rich：Sp1）經 DNA 彎成環，透過 coactivators 招募 Pol II：Mediator（> 20 次單元）、HAT（SAGA，組蛋白乙醯化）、chromatin
  remodeling（SWI/SNF、ISWI，ATP）、TFIID（TAFs）。Architectural protein（HMG）協助彎曲 DNA。酵母 GAL 系統：Gal4（activator）、Gal80（抑制）、Gal3 + galactose 解除抑制。
