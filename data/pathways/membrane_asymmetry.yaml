notes_zh: 外層：PC、SM、醣脂、GPI-anchored 蛋白；內層：PE、PS、PI（PIP₂）、脂質錨定（myristoyl、palmitoyl、farnesyl）蛋白；膽固醇兩層約相等。Flip-flop 自發極慢；flippase（P-type ATPase）把 PS、PE 由外送入內；floppase（ABC）由內送外；scramblase（Ca²⁺ 活化、不耗 ATP）雙向打亂
  → 凋亡細胞與活化血小板 PS 外露（吞噬訊號、凝血表面）。側向擴散快（~μm/s）、轉動快；膜蛋白分類：integral（transmembrane）、peripheral、lipid-anchored（Lehninger 另有 amphitropic）。Lipid raft：富含膽固醇、sphingolipid、GPI 蛋白；caveolin 形成 caveolae。分離膜蛋白：SDS（離子型）、Triton
  X-100（非離子型，保留活性）。
