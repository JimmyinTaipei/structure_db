notes_zh: Caspase：活性位 Cys，切在 Asp 之後。Initiator：2、8、9、10；executioner：3、6、7；發炎型：1、4、5、12。外源：FasL／TNF → death receptor → caspase 8（可經 Bid 放大到粒線體）。內源：DNA damage（p53 → Bax）、ROS → Bax/Bak 在外膜形成孔，cardiolipin 過氧化使
  cyt c 釋出 → 與 Apaf-1、dATP 組成 apoptosome → caspase 9 → caspase 3/7。Bcl-2 抗凋亡。C. elegans 對應：Ced-9 = Bcl-2（抗），Ced-4 = Apaf-1，Ced-3 = caspase 9。凋亡 vs 壞死：凋亡細胞縮小、DNA ladder、PS 外翻（scramblase，Ca²⁺）、無發炎；壞死細胞腫脹、破裂、發炎。
