notes_zh: Hin recombinase 在兩個 hix 反向重複間倒轉一段 DNA（含 hin 與 fljB 的啟動子）。順向：fljB（H2 flagellin）與 fljA（fliC 的 repressor）表現 → fliC 關。倒轉：fljB/fljA 不表現 → fliC（H1 flagellin）開。約每 1000 代切換一次，逃避宿主免疫。其他：phage Mu Gin、酵母
  mating-type（HO）、錐蟲 VSG（基因轉換）。
