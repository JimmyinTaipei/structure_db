notes_zh: 葡萄糖碳原子去向（¹⁴C 追蹤）：aldolase 把 C1–C3 分到 DHAP、C4–C6 分到 GAP；TPI 把 DHAP 的 C1（CH₂OⓅ）變成 GAP 的 C3。因此 pyruvate：CH₃ = glucose C1／C6，C=O = C2／C5，COO⁻ = C3／C4。PDH（或酵母的 pyruvate decarboxylase）放出的 CO₂ 來自 glucose
  C3、C4；acetyl-CoA 的 CH₃ 來自 C1／C6。例：1-¹⁴C-glucose → ¹⁴CH₃–CH₂OH（酒精發酵）、¹⁴CH₃–CO–SCoA。糖質新生反向：pyruvate C3（CH₃）→ glucose C1 與 C6；C2 → C2、C5；C1（COO⁻）→ C3、C4（PC 加入的 CO₂ 會在 PEPCK 離開）。
