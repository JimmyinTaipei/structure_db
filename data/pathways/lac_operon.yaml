notes_zh: lacI（repressor，四聚體）、CAP site、P、O、lacZ（β-galactosidase）、lacY（permease）、lacA（transacetylase）。Lactose → allolactose（β1→6）結合 LacI → 離開 operator（O1；O2、O3 形成 DNA 環加強抑制）。葡萄糖低 → cAMP 高 → CAP–cAMP 結合 CAP
  site、彎曲 DNA、招募 RNA pol（catabolite repression / positive control）。只有「葡萄糖低 + 乳糖有」時大量表現。突變：lacI⁻、O^c 為組成性表現；I^s（不受 inducer 影響）恆關。IPTG 為 gratuitous inducer。
