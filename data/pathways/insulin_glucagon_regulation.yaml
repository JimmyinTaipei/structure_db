notes_zh: 原則：升糖素／腎上腺素經 cAMP–PKA 把酵素磷酸化；胰島素活化 protein phosphatase-1 去磷酸化。被磷酸化而「活化」的只有分解方向的酵素（glycogen phosphorylase、phosphorylase kinase、HSL、FBPase-2）；合成方向（glycogen synthase、ACC、PFK-2、PK-L、HMG-CoA reductase）被磷酸化則失活。
