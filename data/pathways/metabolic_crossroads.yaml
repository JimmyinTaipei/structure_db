notes_zh: G6P：肝醣、糖解、PPP、（肝、腎）葡萄糖輸出。Pyruvate：lactate（無氧、RBC）、alanine（肌肉 → 肝）、OAA（補充 TCA、糖質新生；acetyl-CoA 活化 pyruvate carboxylase）、acetyl-CoA（PDH，不可逆 → 脂肪酸不能變成葡萄糖）。Acetyl-CoA：TCA、脂肪酸、膽固醇、酮體。
