notes_zh: Simple diffusion：氣體、乙醇、尿素（H₂O 略可）；離子、胺基酸、glucose、ATP、G6P 不能自由通過。Transporter（carrier）：GLUT（uniport，促進性擴散，不耗能）、SGLT（Na⁺ 同向 symport，二級主動運輸，靠 Na⁺ 梯度）、ABC（ATP，MDR1 = P-glycoprotein 把藥物打出；CFTR 為 Cl⁻
  通道；ABCA1 膽固醇外送、ABCD1 VLCFA 入 peroxisome）。Pump：Na⁺/K⁺-ATPase（3 Na⁺ 出、2 K⁺ 進，P-type：Asp 磷酸化中間物，ouabain／digoxin 抑制）。ATPase 類型：P（Na/K、Ca²⁺、flippase）、V（溶體、內體 H⁺）、F（F₀F₁ ATP synthase）、ABC（floppase、MDR）。Channel：單一閘門，voltage-gated
  或 ligand-gated（nAChR），aquaporin；pore（porin）一直開。Ionophore：DNP（H⁺）、valinomycin（K⁺ mobile carrier）、gramicidin（channel former）。
