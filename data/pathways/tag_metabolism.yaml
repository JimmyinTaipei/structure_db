notes_zh: 合成：glycerol-3-P（脂肪組織只能由 DHAP 來；肝也可用 glycerol kinase）＋ 3 acyl-CoA。PA 與 DAG 也是磷脂的前驅物。分解：ATGL → HSL（epinephrine／glucagon → PKA 活化；insulin 抑制）→ MGL；脂肪酸接 albumin 運送，glycerol 回肝做糖質新生。
