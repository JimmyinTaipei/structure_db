notes_zh: 果糖在肝經 F1P 進入糖解，繞過 PFK-1（不受調控）。essential fructosuria（fructokinase，良性）vs 遺傳性果糖不耐症（aldolase B，F1P 累積、Pi 耗竭 → 低血糖、肝損傷）。肌肉、脂肪則由 hexokinase 直接做成 F6P。
