notes_zh: '複製錯誤（錯配、小插入／缺失）。E. coli 以 Dam 甲基化區分新舊股：新合成股的 GATC 暫時未甲基化（半甲基化）。MutS 認錯配 → MutL 連接 → MutH 切開最近的半甲基化 GATC 的未甲基化（新）股 → UvrD + 外切酶從切口移除到錯配之後 → Pol III 補、ligase 封口 → Dam 甲基化新股。真核：MSH2–MSH6、MLH1–PMS2，以切口辨識新股；缺陷
  → Lynch syndrome（HNPCC，微衛星不穩定）。

  【補充】Eukaryotes: MSH2–MSH6 (MutSα) / MSH2–MSH3, MLH1–PMS2 (MutLα, endonuclease); strand signal = nicks / Okazaki ends (no MutH). Defect → Lynch syndrome (HNPCC): microsatellite instability, colorectal
  / endometrial cancer.'
