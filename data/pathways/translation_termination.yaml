notes_zh: '終止密碼子進 A 位 → RF1（UAA、UAG）或 RF2（UAA、UGA）結合（eRF1 讀全部），GGQ 使水攻擊 → 胜肽釋出；RF3·GTP（eRF3）移除 RF1/2；RRF + EF-G 拆開核糖體（真核 ABCE1）。RF 與 tRNA、EF-G 與 EF-Tu·tRNA 為分子擬態。tmRNA·SmpB 拯救停在無終止密碼子 mRNA 上的核糖體：加 11-aa
  ssrA tag → ClpXP 分解；mRNA 被分解。合成 N 個胺基酸至少 4N−1 個高能鍵。

  【補充】Energy for a protein of N amino acids: 2N (aminoacylation, ATP → AMP + PP_i) + 1 (IF2) + (N−1) (EF-Tu) + (N−1) (EF-G) = 4N − 1 high-energy bonds; counting RF3 as well gives 4N. Eukaryotes: nonsense-mediated
  decay (premature stop before an exon junction complex), no-go and non-stop decay.

  【補充】RF1 reads UAA, UAG; RF2 reads UAA, UGA (eRF1 reads all three). Its GGQ motif puts water into the peptidyl transferase centre. RF3·GTP (eRF3) removes RF1/2.'
