notes_zh: 常見 DNA 損傷：UV → 環丁烷嘧啶雙體（NER；photolyase）；ROS → 8-oxoG（BER，OGG1）；烷化 → O⁶-methyl-G（MGMT）；自發 → 去嘌呤（AP 位）、去胺（C→U、A→hypoxanthine、G→xanthine、5mC→T）。洋紅為受損部位；dR = DNA 中的去氧核糖。
