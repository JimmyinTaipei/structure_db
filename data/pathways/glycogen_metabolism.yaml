notes_zh: 合成：G6P → G1P → UDP-Glc → 肝醣（synthase 限速，insulin 活化）。分解：phosphorylase（PLP，限速，glucagon／epinephrine 活化）→ G1P → G6P；肝有 G6Pase 可釋出葡萄糖，肌肉沒有。GSD：0 synthase、Ia von Gierke（G6Pase）、II Pompe（溶小體 acid α-glucosidase）、III
  Cori（debranching）、IV Andersen（branching）、V McArdle（肌 phosphorylase）、VI Hers（肝 phosphorylase）。
