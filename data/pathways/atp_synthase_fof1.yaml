notes_zh: F_o（o = oligomycin-sensitive）在膜內：H⁺ 由 a 次單元的膜間腔側半通道進入，與 c 次單元的 Asp/Glu 結合，c ring 轉約一圈後由基質側半通道放出。c ring、γ、ε 一起轉動（rotor）；a、b₂、δ、α₃β₃ 固定（stator），b₂ 與 δ 防止 α₃β₃ 跟著轉。γ 每轉 120°，三個 β 各自改變構形：O（空）→ L（鬆，ADP＋Pi
  結合）→ T（緊，ATP 在活性位自發生成）→ O（釋放 ATP）。耗能的是 ATP 的釋放。哺乳類 c ring 有 8 個 c → 每轉一圈 8 H⁺ 產生 3 ATP（約 2.7 H⁺/ATP），加上 PiC 的 1 H⁺ → 約 3.7 ≈ 4 H⁺/ATP。ANT 由膜電位驅動（ATP⁴⁻ 出、ADP³⁻ 進），atractyloside 與 bongkrekic acid 抑制。
