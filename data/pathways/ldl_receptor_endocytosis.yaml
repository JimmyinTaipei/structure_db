notes_zh: Clathrin 為三腳形 triskelion（3 重鏈 + 3 輕鏈）；AP2 連接受體與 clathrin；dynamin（GTPase）切下小泡。內體酸化使 LDL 與受體分離，受體回到膜上；LDL 進溶體，cholesteryl ester 被 acid lipase 水解。游離膽固醇：抑制 HMG-CoA reductase（SREBP 停止）、減少 LDL receptor
  合成、活化 ACAT 酯化儲存。家族性高膽固醇血症：LDL receptor 缺陷。胞吞種類：phagocytosis（>200 nm）、pinocytosis（clathrin、caveolin、macropinocytosis）。
