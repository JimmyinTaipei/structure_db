notes_zh: 'DNA（2 nm）→ 核小體（11 nm，「串珠」）→ 30 nm 纖維（H1 協助）→ 掛在蛋白質骨架上的環（~300 nm）→ 中期染色體（~1400 nm）。核小體：H2A、H2B、H3、H4 各兩個組成八聚體，纏繞 ~147 bp DNA 1.7 圈；H1 結合 linker DNA。組蛋白富含 Lys、Arg（正電）。原核：類核（nucleoid）以 HU、IHF 等蛋白壓縮，無組蛋白（古菌有）。

  【補充】Nucleosome core: histone octamer (H2A, H2B, H3, H4) × 2 + ~147 bp DNA wrapped 1.7 turns; histones rich in Lys/Arg (+). Euchromatin: open, acetylated, active. Heterochromatin: condensed, H3K9me3, inactive.'
