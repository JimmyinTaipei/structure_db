notes_zh: trp operon 有兩層控制：TrpR + Trp（corepressor）結合 operator（negative repressible，約 70 倍）；attenuation（約 10 倍）。Leader（trpL）14 aa 的胜肽含兩個連續 Trp 密碼子，mRNA 有序列 1–4。Trp 少：核糖體停在序列 1 → 2:3 配對（antiterminator）→ 繼續轉錄。Trp
  多：核糖體蓋住序列 2 → 3:4 形成終止莖環 + UUUU → 提前終止。需要轉錄與轉譯偶聯（只有原核）。his、phe、leu operon 也用 attenuation。
