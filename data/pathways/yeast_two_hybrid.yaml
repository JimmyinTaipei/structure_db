notes_zh: Gal4 分成 DNA-binding domain（BD，結合 UAS）與 activation domain（AD）。BD–X（bait）與 AD–Y（prey，可為 cDNA library）共表現；X 與 Y 結合才把 AD 帶到啟動子 → reporter（lacZ、HIS3）表現。用於蛋白–蛋白交互作用；one-hybrid 測 DNA–蛋白、three-hybrid
  測 RNA–蛋白。偽陽性：自活化的 bait。
