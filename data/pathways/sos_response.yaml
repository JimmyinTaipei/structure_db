notes_zh: '平時 LexA 二聚體壓住 SOS 基因。DNA 損傷產生單股 DNA → RecA 結合成 RecA*（活化）→ 作為共蛋白酶促使 LexA 自我切割 → SOS 基因表現：recA、lexA、uvrA/B（NER）、sulA（暫停分裂）、Pol II、Pol IV（dinB）、Pol V（UmuD′₂C；活性形式為 UmuD′₂C–RecA–ATP，UmuD 需 RecA*
  協助自切成 UmuD′）。TLS：Pol III 在損傷前停住 → 換成 Pol IV/V 越過損傷（無校對，易錯）→ 再換回 Pol III。真核 TLS：Pol η（可正確越過 T=T；缺陷 → XP variant）、Pol ζ、Rev1。

  【補充】SOS = last-resort, error-prone survival response. Eukaryotic TLS polymerases: Pol η (accurate across T=T; defect → XP variant), Pol ζ, Rev1, Pol κ, Pol ι. Stalled forks can also restart by recombination
  (Pol II, RecA; "chicken-foot" fork regression).'
