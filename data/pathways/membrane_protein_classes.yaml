notes_zh: Integral（內在）：穿過疏水核心，單次跨膜（α 螺旋約 20 個疏水胺基酸）、多次跨膜（GPCR 7 次）、β-barrel（porin、外膜）；需界面活性劑（SDS、Triton X-100）才能取出。Peripheral（周邊）：以離子鍵、氫鍵結合在膜表面或其他膜蛋白上（如 cytochrome c、spectrin），高鹽、改變 pH 或 EDTA 即可洗下。Amphitropic：可逆地結合在膜上。Lipid-anchored：GPI（膜外側，PI-PLC
  可切下）；內側的 myristoyl（N 端 Gly）、palmitoyl（Cys）、prenyl（farnesyl／geranylgeranyl，C 端 CaaX，如 Ras）。Hydropathy plot 找出約 20 個疏水胺基酸的區段可預測跨膜螺旋。
