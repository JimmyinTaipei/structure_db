notes_zh: β–γ 斷裂（→ ADP + Pi）用掉 1 個高能鍵：激酶、ATPase、主動運輸。α–β 斷裂（→ AMP + PPi）再由 pyrophosphatase 水解 PPi → 2 Pi，相當於消耗 2 個高能鍵，讓反應強力往右（不可逆）：胺基酸活化（aminoacyl-tRNA）、脂肪酸活化（acyl-CoA，故 β 氧化計算要扣 2 ATP）、UDP-glucose 合成（UTP
  → PPi）、尿素循環 ASS、核酸聚合。其他 NTP：CTP → 磷脂（CDP-choline、CDP-ethanolamine）；GTP → 蛋白質合成（IF2、EF-Tu、EF-G、RF3）、糖質新生 PEPCK；UTP → 醣（UDP-Glc）。高能可識別記號：UDP（醣）、CoA（醯基）、SAM（甲基）。
