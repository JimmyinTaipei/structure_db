id: lineweaver_burk
title: Lineweaver–Burk (double reciprocal) plot
layout: plot
plot:
  size:
  - 15
  - 9.5
  params:
    Vmax: 1
    Km: 2
  x:
    min: -0.8
    max: 1.6
    label: 1/[S]
    marks:
    - at: -1/Km
      label: −1/K_m
  y:
    min: -0.6
    max: 4.4
    label: 1/v_0
    marks:
    - at: 1/Vmax
      label: 1/V_{max}
      dy: -0.6
  curves:
  - id: lb
    y: Km/Vmax*x + 1/Vmax
    from: -1/Km*1.25
    to: 1.6
    width: 1.1
    label: slope = K_m/V_{max}
    label_at: 1.15
    label_off:
    - 0.3
    - 0.9
  points:
  - 'on': lb
    x: -1/Km
    y: 0
    dot: true
  - 'on': lb
    x: 0
    y: 1/Vmax
    dot: true
  texts:
  - at:
    - 1.0
    - 0.7
    text: 1/v_0 = (K_m/V_{max})(1/[S]) + 1/V_{max}
    size: 1.05
tags:
- enzyme
- enzyme_kinetics
notes_zh: 雙倒數圖：1/v₀ = (K_m/V_{max})(1/[S]) + 1/V_{max}。y 截距 = 1/V_{max}，x 截距 = −1/K_m，斜率 = K_m/V_{max}。把雙曲線拉成直線，方便讀出 K_m、V_{max} 和判斷抑制型式。
status: pending
