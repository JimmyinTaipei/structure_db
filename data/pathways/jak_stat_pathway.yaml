notes_zh: 受體本身無酵素活性，配體使受體二聚化 → 結合的 JAK 互相磷酸化 → 磷酸化受體的 Tyr → STAT 以 SH2 結合 P-Tyr → JAK 磷酸化 STAT → STAT-P 脫離、二聚化、入核當轉錄因子。例：EPO（紅血球生成）、leptin（飽足）、GH、interferon、IL。JAK2 V617F → polycythemia vera。SOCS 回饋抑制。
